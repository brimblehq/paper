        - attached_sandbox_id
        - attached_project_id
        - last_attached_at
        - _id
    InsightsRange:
      type: object
      properties:
        from:
          type: string
          description: Start of the range (ISO 8601).
        to:
          type: string
          description: End of the range (ISO 8601).
        step:
          type: string
          description: Interval between points, in seconds, for example `"60"`.
      required:
        - from
        - to
        - step
    InsightsSummaryStat:
      type: object
      properties:
        value:
          type: number
          nullable: true
          description: Value for the selected range.
        delta:
          type: number
          nullable: true
          description: Change compared with the previous range of the same length, as a percentage.
      required:
        - value
        - delta
    LifecycleRule:
      type: object
      properties:
        id:
          type: string
          nullable: true
          description: Name of the rule.
        prefix:
          type: string
          nullable: true
          description: Only objects whose key starts with this prefix are affected. Empty applies to the whole bucket.
        expirationDays:
          type: number
          nullable: true
          description: Delete objects this many days after they were created.
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleRule_Transition'
          nullable: true
          description: Move objects to another storage class after a number of days.
    LifecycleRule_Transition:
      type: object
      properties:
        days:
          type: number
          nullable: true
          description: Days after creation when the object moves.
        storageClass:
          type: string
          nullable: true
          description: Storage class to move the object to.
    LinkDatabaseProjectsResult:
      type: object
      properties:
        linked:
          type: array
          description: IDs of projects that now have the database connection variables.
          items:
            type: string
        skipped:
          type: array
          description: Projects that were not linked, with the reason.
          items:
            $ref: '#/components/schemas/LinkDatabaseProjectsSkipped'
      required:
        - linked
        - skipped
    LinkDatabaseProjectsSkipped:
      type: object
      properties:
        projectId:
          type: string
          description: ID of the project that was skipped.
        key:
          type: string
          description: Variable name that caused the skip.
        reason:
          type: string
          description: Why the project was skipped, for example because it already has a variable with that name.
      required:
        - projectId
        - key
        - reason
    LogDrainResponse:
      type: object
      properties:
        id:
          type: string
          description: ID of the log drain.
        userId:
          type: string
          nullable: true
          description: User who owns the drain.
        teamId:
          type: string
          nullable: true
          description: Team that owns the drain. `null` for personal drains.
        name:
          type: string
          description: Name of the drain.
        type:
          type: string
          description: "`https` posts logs to a URL; `s3` writes them to an S3-compatible bucket."
          enum:
            - https
            - s3
        url:
          type: string
          nullable: true
          description: Destination URL. Set when `type` is `https`.
        headerKeys:
          type: array
          description: Names of the custom headers sent with each request. Values are not returned.
          items:
            type: string
        s3:
          allOf:
            - $ref: '#/components/schemas/LogDrainS3ResponseConfig'
          nullable: true
          description: Bucket settings. Set when `type` is `s3`.
        sources:
          type: array
          description: "Log types sent: `app` (your app's output), `system` (build and platform events) and `http` (request logs)."
          items:
            type: string
            enum:
              - app
              - system
              - http
        status:
          type: string
          description: "Delivery state: `ok`, `failing`, `provisioning`, or disabled automatically, by you, or by your plan."
          enum:
            - provisioning
            - ok
            - failing
            - disabled_auto
            - disabled_user
            - disabled_plan
        statusReason:
          type: string
          nullable: true
          description: Why the drain is failing or disabled.
        disabledAt:
          type: string
          format: date-time
          nullable: true
          description: When the drain was disabled (ISO 8601).
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: When the drain was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the drain was last changed (ISO 8601).
      required:
        - id
        - userId
        - teamId
        - name
        - type
        - url
        - headerKeys
        - s3
        - sources
        - status
        - statusReason
        - disabledAt
    LogDrainS3ResponseConfig:
      type: object
      properties:
        region:
          type: string
          nullable: true
          description: Region of the bucket.
        endpoint:
          type: string
          nullable: true
          description: S3-compatible endpoint URL. `null` for AWS S3.
        bucket:
          type: string
          nullable: true
          description: Bucket name.
        keyPrefix:
          type: string
          nullable: true
          description: Prefix added to every log file key.
        storageBucketId:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: string
          nullable: true
          description: ID of the Brimble storage bucket, when the drain writes to one.
    LogDrainTestResult:
      type: object
      properties:
        ok:
          type: boolean
          description: "`true` when the destination accepted the test log."
        statusCode:
          type: number
          nullable: true
          description: HTTP status returned by the destination.
        message:
          type: string
          description: Details of the result.
      required:
        - ok
        - message
    MappedLogResponse:
      type: object
      properties:
        status:
          type: number
          description: HTTP status code returned.
        url:
          type: string
          description: Full URL that was requested.
        browser:
          type: string
          description: User-Agent header of the client.
        timestamp:
          type: string
          description: When the request was received (ISO 8601).
        hostname:
          type: string
          description: Host that was requested.
        project:
          type: string
          description: ID of the project.
        headers:
          description: Request headers. Cookies, tokens and passwords are redacted.
        query:
          description: Query string parameters.
        method:
          type: string
          description: HTTP method.
        message:
          type: string
          description: Log message, usually `<METHOD> <path>`.
      required:
        - status
        - url
        - browser
        - timestamp
        - hostname
        - project
        - headers
        - query
        - method
        - message
    ObjectId:
      type: string
      pattern: ^[a-fA-F0-9]{24}$
      example: 6a81bed11470bfcd2a5dbcfa
    PaginatedDatabaseUsersResponse:
      type: object
      properties:
        data:
          type: array
          description: Database users on this page.
          items:
            $ref: '#/components/schemas/DatabaseUserResponse'
        totalCount:
          type: number
          description: Total number of items across all pages.
        currentPage:
          type: number
          description: Page returned, starting at 1.
        totalPages:
          type: number
          description: Number of pages at the requested `limit`.
        limit:
          type: number
          description: Items per page.
      required:
        - data
        - totalCount
        - currentPage
        - totalPages
        - limit
    PaginatedLogResponse:
      type: object
      properties:
        logs:
          type: array
          description: Request logs on this page.
          items:
            $ref: '#/components/schemas/MappedLogResponse'
        totalLogs:
          type: number
          description: Number of logs on this page.
        totalPages:
          type: number
          description: "`currentPage + 1` when more logs exist; otherwise `currentPage`."
        currentPage:
          type: number
          description: Page returned.
        filterBy:
          type: string
          description: Field the logs are sorted by.
        hasMore:
          type: boolean
          nullable: true
          description: "`true` when older (or newer) logs exist. Pass `nextCursor` as `cursor` to get them."
        nextCursor:
          type: string
          nullable: true
          description: Cursor for the next page. `null` when `hasMore` is `false`.
      required:
        - logs
        - totalLogs
        - totalPages
        - currentPage
        - filterBy
    PaginatedResponse_DatabaseHistoryItem:
      type: object
      properties:
        data:
          type: array
          description: Backups and restores on this page, newest first.
          items:
            oneOf:
              - $ref: '#/components/schemas/DatabaseBackupHistoryItem'
              - $ref: '#/components/schemas/DatabaseRestoreHistoryItem'
        totalCount:
          type: number
          description: Total number of items across all pages.
        currentPage:
          type: number
          description: Page returned, starting at 1.
        totalPages:
          type: number
          description: Number of pages at the requested `limit`.
        limit:
          type: number
          description: Items per page.
      required:
        - data
        - totalCount
        - currentPage
        - totalPages
        - limit
    PaginatedResponse_SandboxResponse:
      type: object
      properties:
        data:
          type: array
          description: Sandboxes on this page.
          items:
            $ref: '#/components/schemas/SandboxResponse'
        totalCount:
          type: number
          description: Total number of items across all pages.
        currentPage:
          type: number
          description: Page returned, starting at 1.
        totalPages:
          type: number
          description: Number of pages at the requested `limit`.
        limit:
          type: number
          description: Items per page.
      required:
        - data
        - totalCount
        - currentPage
        - totalPages
        - limit
    Project:
      type: object
      properties:
        tags:
          type: array
          description: Tags attached to the project.
          items:
            $ref: '#/components/schemas/ITag'
        disabled:
          type: boolean
          description: "`true` when Brimble has disabled the project (see `disabled_by`). A disabled project does not serve traffic."
        disabled_by:
          description: Why the project was disabled. `null` when it is not disabled.
          oneOf:
            - type: string
              enum:
                - payment_failure
                - billing_restricted
                - plan_limit
                - plan_feature
                - subscription_ended
              nullable: true
            - type: string
              enum:
                - billing_restricted
                - plan_limit
                - plan_feature
        disabled_at:
          description: When the project was disabled (ISO 8601). `null` when it is not disabled.
          oneOf:
            - type: string
              format: date-time
              nullable: true
            - type: string
              format: date-time
        scheduled_deletion_at:
          description: When a disabled project is scheduled to be deleted (ISO 8601). `null` when no deletion is scheduled.
          oneOf:
            - nullable: true
            - type: string
              format: date-time
        days_remaining:
          description: Whole days left before the scheduled deletion. `null` when no deletion is scheduled.
          oneOf:
            - nullable: true
            - type: number
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          description: Project name. Also used as the default `<name>.brimble.app` subdomain.
        description:
          type: string
          description: Free-text description of the project.
        authEnabled:
          type: boolean
          description: "MCP servers only: when `true`, requests must send a valid Brimble API key before they reach the server."
        replica_ready:
          type: boolean
          description: "`true` once the running deployment has passed its health checks and is serving traffic."
        has_custom_domain:
          type: boolean
          description: "`true` when at least one domain other than the default `*.brimble.app` subdomain is attached."
        domain:
          type: string
          description: Primary address of the project. A full `https://` URL for apps and sites; a `host:port` address for databases.
        domains:
          type: array
          description: Every domain attached to the project.
          items:
            type: object
            properties:
              _id:
                $ref: '#/components/schemas/ObjectId'
              name:
                type: string
                description: Hostname, for example `app.example.com`.
              primary:
                type: boolean
                description: "`true` for the domain shown as the project's main address."
            required:
              - _id
              - name
              - primary
        serviceType:
          type: string
          description: What kind of service the project is.
          enum:
            - database
            - web-service
            - static
            - mcp
            - liscense
            - worker
        diskSize:
          type: number
          nullable: true
          description: Size of the attached persistent volume, in GB. `null` when no volume is attached.
        volume:
          allOf:
            - $ref: '#/components/schemas/ProjectVolumeResponse'
          nullable: true
          description: Persistent volume attached to the project, or `null`.
        ha:
          type: boolean
          description: "Databases only: `true` when the database runs as a high-availability cluster (one primary and replicas in other regions)."
        haCluster:
          type: object
          properties:
            clusterName:
              type: string
              description: Internal name of the cluster.
            regions:
              type: array
              description: Regions the cluster members run in.
              items:
                oneOf:
                  - $ref: '#/components/schemas/ObjectId'
                  - $ref: '#/components/schemas/IRegion'
            members:
              type: array
              description: Cluster members (one primary and its replicas).
              items:
                type: object
          required:
            - clusterName
            - regions
            - members
          nullable: true
          description: High-availability cluster layout. `null` unless `ha` is `true`.
        provisionProgress:
          allOf:
            - $ref: '#/components/schemas/IDatabaseProvisionProgress'
          nullable: true
          description: "Databases only: progress of the current create, retry or refresh operation. `null` when nothing is running."
        tlsEnabled:
          type: boolean
          nullable: true
          description: "Databases only: `true` when the database requires TLS for connections. Omitted for other service types."
        volumeMount:
          type: string
          nullable: true
          description: Path inside the container where the persistent volume is mounted, for example `/data`. `null` when no volume is attached.
        previews:
          type: array
          description: Active preview deployments (one per branch or pull request).
          items:
            type: object
            properties:
              id:
                $ref: '#/components/schemas/ObjectId'
              name:
                type: string
                description: Preview name, for example `pr12-my-app`.
              branch:
                type: string
                description: Git branch the preview was built from.
              domain:
                type: string
                description: Full URL of the preview deployment.
              gitLink:
                type: string
                nullable: true
                description: Link to the branch in the Git provider.
            required:
              - id
              - name
              - branch
              - domain
              - gitLink
        gitLink:
          type: string
          nullable: true
          description: Link to the connected repository branch in the Git provider. `null` when no repository is connected.
        status:
          type: string
          description: Status of the latest deployment. `ACTIVE` means it is live; `INPROGRESS` means a build or deploy is running; `FAILED` means the last deploy failed.
          enum:
            - AWAITING_CONFIG_APPROVAL
            - INACTIVE
            - ACTIVE
            - INPROGRESS
            - FAILED
            - PENDING
            - CANCELLED
            - SUPERSEDED
            - DEGRADED
            - PAYMENT DUE
            - NOMAD_READY
            - NOMAD_FAILED
        framework:
          type: string
          description: Framework slug detected or chosen for the project, for example `nextjs` or `docker`.
        frameworkType:
          type: string
          enum:
            - spa
            - ssr
            - static
            - backend
          nullable: true
          description: "How the framework is served: `spa` and `static` are static files, `ssr` and `backend` run a server."
        frameworkLogo:
          type: string
          nullable: true
          description: URL of the framework logo. `null` when unknown.
        isPrivate:
          type: boolean
          description: "`true` when the connected repository is private."
        maintenance:
          type: boolean
          description: "`true` when maintenance mode is on. Visitors see a maintenance page instead of the app."
        previewDeploymentsEnabled:
          type: boolean
          description: "`true` when pull requests and non-production branches get their own preview deployments."
        managedByConfig:
          allOf:
            - $ref: '#/components/schemas/ConfigManagedFields'
          nullable: true
          description: Set when the project is managed by a `brimble.toml` file in the repository. Lists the fields the file controls. `null` otherwise.
        starred:
          type: boolean
          description: "`true` when the project is starred (pinned) in the dashboard."
        passwordEnabled:
          type: boolean
          description: "`true` when visitors must enter a password to view the project."
        buildCacheEnabled:
          type: boolean
          nullable: true
          description: "`true` when build dependencies are cached between deployments to speed up builds."
        buildHealthCheck:
          type: boolean
          description: "`true` when a new deployment must pass health checks before it replaces the running one. Defaults to `true`."
        runtimeVersions:
          allOf:
            - $ref: '#/components/schemas/RuntimeVersions'
          nullable: true
          description: 'Language runtime versions pinned for builds, keyed by runtime, for example `{ \"node\": \"20\" }`. `null` when the defaults are used.'
        public:
          type: boolean
          description: "`true` when the project accepts traffic from the internet. When `false`, it is reachable only from other services on Brimble's private network. Defaults to `true`."
        http2:
          type: boolean
          description: "`true` when Brimble talks to your app over HTTP/2 (h2c) instead of HTTP/1.1."
        password:
          type: string
          nullable: true
          description: Password-protection password, when enabled.
        healthStatus:
          allOf:
            - $ref: '#/components/schemas/ConsulHealthStatus'
          nullable: true
          description: Result of the latest health check against the running deployment.
        healthCheckPath:
          type: string
          nullable: true
          description: HTTP path Brimble requests to check the app is healthy, for example `/health`. `null` uses the default check.
        preStartCommand:
          type: string
          nullable: true
          description: Command run in a separate container before each new deployment starts, for example database migrations. `null` when not set.
        installCommand:
          type: string
          description: Command that installs dependencies, for example `npm install`.
        buildCommand:
          type: string
          description: Command that builds the app, for example `npm run build`.
        startCommand:
          type: string
          description: Command that starts the app, for example `npm start`.
        outputDirectory:
          type: string
          description: Folder that contains the built files to serve, for example `dist`. Used by static sites.
        rootDirectory:
          type: string
          nullable: true
          description: Folder in the repository that contains the app, for monorepos. Empty means the repository root.
        dockerfile:
          type: string
          nullable: true
          description: Path to the Dockerfile, relative to the root directory, when the framework is `docker`. `null` uses `Dockerfile`.
        watchPaths:
          type: array
          description: Glob patterns of files that trigger a new deployment on push, for example `apps/web/**`. Empty means every change triggers a deployment.
          items:
            type: string
        cronEnabled:
          type: boolean
          description: "Workers and web services: `true` when the project runs on a cron schedule."
        cronExpression:
          type: string
          nullable: true
          description: Cron schedule in 5-field or 6-field format, for example `0 * * * *`. `null` when cron is off.
        cronTimezone:
          type: string
          nullable: true
          description: IANA timezone the cron schedule runs in, for example `Africa/Lagos`. Defaults to `UTC`.
        cronCommand:
          type: string
          nullable: true
          description: "Web services only: command run on each cron tick. `null` when cron is off."
        backupUrl:
          oneOf:
            - type: string
            - type: boolean
          nullable: true
          description: "Databases only: download URL of the latest backup. `false` when backups are off; `null` when no backup exists yet."
        backupSize:
          oneOf:
            - type: number
            - type: boolean
          nullable: true
          description: "Databases only: size of the latest backup. `false` when backups are off; `null` when no backup exists yet."
        deployedInCluster:
          type: boolean
          description: "`true` when the project runs on Brimble's cluster scheduler."
        lastBackup:
          oneOf:
            - type: boolean
            - type: string
              format: date-time
          nullable: true
          description: "Databases only: when the latest backup finished (ISO 8601). `false` when backups are off; `null` when no backup exists yet."
        autoscalingGroup:
          allOf:
            - $ref: '#/components/schemas/IAutoScalingGroup'
          nullable: true
          description: Autoscaling group applied to the project, or `null`.
        environments:
          type: array
          description: Secrets (environment variables) set on the project.
          items:
            type: object
            additionalProperties: {}
        log:
          type: object
          description: Latest deployment.
          properties:
            id:
              $ref: '#/components/schemas/ObjectId'
            name:
              type: string
              description: Name of the deployment log.
            message:
              type: string
              description: Commit message of the deployed commit.
          required:
            - id
            - name
            - message
        runner:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/ObjectId'
            name:
              type: string
              description: Name of the build server.
            tag:
              type: string
              description: Tag of the build server.
            location:
              description: Location of the build server.
          required:
            - id
            - name
            - tag
            - location
          nullable: true
          description: Build server that ran the latest build.
        repo:
          type: object
          properties:
            name:
              type: string
              description: Repository name (for example `web`), or the image reference for Docker projects (for example `nginx:1.27`).
            full_name:
              type: string
              description: Full repository name including the owner, for example `acme/web`.
            id:
              description: Repository ID in the Git provider.
              oneOf:
                - type: string
                - type: number
            branch:
              type: string
              description: Branch that deploys to production.
            installationId:
              description: Git provider app installation that grants access to the repository.
              oneOf:
                - type: string
                - type: number
            git:
              type: string
              description: Git provider of the repository, or `DOCKER` for an image.
              enum:
                - GITHUB
                - GITLAB
                - BITBUCKET
                - DOCKER
                - HUGGINGFACE
                - ORIGIN
          required:
            - name
            - full_name
            - id
            - branch
            - installationId
            - git
          nullable: true
          description: Connected Git repository or Docker image. `null` for projects deployed from uploaded files.
        hasUpdates:
          type: boolean
          description: "`true` when project settings changed since the last deployment and a redeploy is needed to apply them."
        team:
          type: object
          description: Team that owns the project. `null` for personal projects.
          properties:
            id:
              $ref: '#/components/schemas/ObjectId'
            name:
              type: string
              description: Name of the team.
          required:
            - id
            - name
        projectEnvironmentId:
          description: ID of the environment (production, staging, …) the project belongs to.
        git_connected:
          type: boolean
          description: "`true` when the repository is reachable with the connected Git account."
        trackingToken:
          type: string
          description: Token used by Brimble's built-in web analytics script for this project.
        screenshot:
          type: string
          description: URL of the latest screenshot of the live site.
        dbImage:
          $ref: '#/components/schemas/IDbImage'
        workBenchEnabled:
          type: boolean
          description: "Databases only: `true` when the in-dashboard database workbench (query editor) is enabled."
        pgbouncerEnabled:
          type: boolean
          nullable: true
          description: "PostgreSQL only: `true` when connections go through PgBouncer connection pooling. Omitted for other service types."
        pgbouncerConfig:
          allOf:
            - $ref: '#/components/schemas/IPgBouncerConfig'
          nullable: true
          description: "PostgreSQL only: PgBouncer settings. Omitted for other service types."
        whiteListedIps:
          type: array
          description: "Databases only: IP addresses or CIDR ranges allowed to connect. Empty means any address can connect."
          items:
            type: string
        specs:
          $ref: '#/components/schemas/IProjectSpecs'
        subscription:
          type: object
          properties:
            plan_type:
              type: string
              description: Plan the project is billed under.
              enum:
                - FREE_PLAN
                - DEVELOPER_PLAN
                - TEAM_PLAN
                - DOMAIN_PLAN
                - HACKER_PLAN
                - LISCENSE_PLAN
                - EMAIL_FORWARDING_PLAN
            stripe_status:
              type: string
              description: Stripe subscription status, for example `active` or `past_due`.
          required:
            - plan_type
            - stripe_status
          nullable: true
          description: Billing plan of the project.
        connectionUri:
          type: string
          nullable: true
          description: "Databases only: public connection string."
        internalUrl:
          type: string
          nullable: true
          description: Address other services on Brimble's private network use to reach this project. `null` when not available.
        connections:
          type: array
          items:
            $ref: '#/components/schemas/IProjectConnection'
          nullable: true
          description: Other projects this project is connected to (for example apps linked to a database).
        createdAt:
          type: string
          format: date-time
          description: When the project was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          description: When the project was last changed (ISO 8601).
