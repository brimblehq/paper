                  data:
                    type: object
                    description: The result of the request.
                    properties:
                      id:
                        type: string
                        description: ID of the domain.
                      name:
                        type: string
                        description: Hostname.
                      wildcard_enabled:
                        type: boolean
                        description: "`true` when `*.<domain>` also routes to the project."
                      wildcard_verified:
                        type: boolean
                        description: "`true` once the wildcard certificate is issued."
                    required:
                      - id
                      - name
                      - wildcard_enabled
                      - wildcard_verified
        '400':
