    QueuedEnvironmentClone:
      type: object
      properties:
        environment:
          $ref: '#/components/schemas/IProjectEnvironment'
        include:
          $ref: '#/components/schemas/CloneEnvironmentInclude'
        jobId:
          type: string
          description: ID of the clone job.
        status:
          type: string
          description: Always `queued`. The clone runs in the background.
          enum:
            - queued
      required:
        - environment
        - include
        - jobId
        - status
    RateLimitMatcher:
      type: object
      properties:
        methods:
          type: array
          items:
            type: string
          nullable: true
          description: HTTP methods the zone applies to, for example `POST`. Empty applies to all methods.
        paths:
          type: array
          items:
            type: string
          nullable: true
          description: Paths the zone applies to, for example `/api/*`. Empty applies to all paths.
    RateLimitZone:
      type: object
      properties:
        name:
          type: string
          description: Name of the zone.
        key:
          type: string
          description: What requests are counted by. `ip.src` counts per client IP; a placeholder such as `{http.request.header.X-API-Key}` counts per header value.
        window:
          type: string
          description: Length of the counting window, for example `10s`, `1m` or `1h`. Unsupported windows return `400`.
        events:
          type: number
          description: Requests allowed per `key` in each `window`. Further requests get `429`.
        matcher:
          allOf:
            - $ref: '#/components/schemas/RateLimitMatcher'
          nullable: true
          description: Limits the zone to some methods or paths. Omit to apply it to every request.
        ipv4Prefix:
          type: number
          nullable: true
          description: When `key` is `ip.src`, group IPv4 clients by this prefix length, for example `24` for a /24 network. 0 to 32.
        ipv6Prefix:
          type: number
          nullable: true
          description: When `key` is `ip.src`, group IPv6 clients by this prefix length, for example `64`. 0 to 128.
      required:
        - name
        - key
        - window
        - events
    RatelimitSettingsResponse:
      type: object
      properties:
        project:
          type: string
          description: ID of the project.
        enabled:
          type: boolean
          description: "`true` when rate limiting is on."
        zones:
          type: array
          description: Rate limit rules.
          items:
            $ref: '#/components/schemas/RateLimitZone'
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: When the settings were created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the settings were last changed (ISO 8601).
      required:
        - project
        - enabled
        - zones
    RepoType:
      type: object
      properties:
        id:
          oneOf:
            - type: string
            - type: number
          nullable: true
          description: Repository ID in the Git provider.
        name:
          type: string
          description: Repository full name (for example `acme/web`), or the image reference for Docker (for example `nginx:1.27`).
        branch:
          type: string
          description: Branch to deploy.
        installationId:
          oneOf:
            - type: string
            - type: number
          nullable: true
          description: Git provider app installation that grants access to the repository.
        git:
          type: string
          enum:
            - GITHUB
            - GITLAB
            - BITBUCKET
            - DOCKER
            - ORIGIN
          nullable: true
          description: Git provider, or `DOCKER` for an image.
      required:
        - name
        - branch
    RuntimeVersions:
      type: object
      additionalProperties:
        type: string
    SandboxEgressConfig:
      type: object
      properties:
        mode:
          type: string
          description: "`open` allows all outbound traffic; `restricted` allows only `allow`; `deny_all` blocks everything."
          enum:
            - open
            - restricted
            - deny_all
        allow:
          type: array
          items:
            type: string
          nullable: true
          description: "Destinations reachable when `mode` is `restricted`: IPv4 addresses, CIDR ranges or hostnames. Up to 50."
      required:
        - mode
    SandboxRegionDetail:
      type: object
      properties:
        id:
          type: string
          description: ID of the region.
        name:
          type: string
          description: Name of the region.
        country:
          type: string
          description: Country the region is in.
        continent:
          type: string
          nullable: true
          description: Continent the region is in.
        enabled:
          type: boolean
          description: "`true` when sandboxes can be created in the region."
        type:
          type: string
          description: Region type. Always `sandbox` here.
      required:
        - id
        - name
        - country
        - continent
        - enabled
        - type
    SandboxResponse:
      type: object
      properties:
        id:
          type: string
          description: ID of the sandbox.
        name:
          type: string
          description: Name of the sandbox.
        template:
          type: string
          description: Template (base image) the sandbox started from, for example `python-3.12`.
        size:
          type: string
          nullable: true
          description: Size preset, for example `sbx.micro`. Sets CPU, memory and disk.
        status:
          type: string
          description: Current state of the sandbox.
          enum:
            - starting
            - ready
            - failed
            - destroyed
            - pausing
            - paused
            - resuming
        region:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/SandboxRegionDetail'
          nullable: true
          description: Region the sandbox runs in.
        specs:
          $ref: '#/components/schemas/ISandboxSpecs'
        team:
          type: string
          nullable: true
          description: Team that owns the sandbox.
        project_environment:
          type: string
          nullable: true
          description: Environment the sandbox belongs to.
        auto_destroy:
          type: boolean
          description: "`true` when the sandbox is destroyed after `destroy_timeout` of inactivity."
        destroy_timeout:
          type: string
          nullable: true
          description: "Idle time before auto-destroy: `30m`, `1h`, `3h`, `6h`, `12h` or `18h`."
        one_shot:
          type: boolean
          description: "`true` when the sandbox is destroyed as soon as it stops."
        block_outbound:
          type: boolean
          description: "`true` when all outbound network traffic is blocked."
        egress:
          $ref: '#/components/schemas/SandboxEgressConfig'
        persistent:
          type: boolean
          description: "`true` when the sandbox has a persistent disk that survives restarts."
        persistent_disk_gb:
          type: number
          nullable: true
          description: Size of the persistent disk, in GB.
        paused_at:
          type: string
          format: date-time
          nullable: true
          description: When the sandbox was paused (ISO 8601).
        from_snapshot:
          type: string
          nullable: true
          description: ID of the snapshot the sandbox was created from.
        snapshot_mode:
          type: string
          description: "`automatic` takes snapshots on `snapshot_frequency`; `manual` only when you ask."
          enum:
            - automatic
            - manual
        snapshot_frequency:
          type: string
          nullable: true
          description: Cron expression for automatic snapshots.
        created_at:
          type: string
          format: date-time
          description: When the sandbox was created (ISO 8601).
        last_activity_at:
          type: string
          format: date-time
          description: When the sandbox was last used (ISO 8601).
        expires_at:
          type: string
          format: date-time
          description: When the sandbox will be destroyed if it stays idle (ISO 8601).
        destroyed_at:
          type: string
          format: date-time
          nullable: true
          description: When the sandbox was destroyed (ISO 8601).
        destroy_reason:
          type: string
          enum:
            - user
            - idle_ttl
            - max_lifetime
            - failed
            - one_shot_stopped
            - paused_too_long
          nullable: true
          description: "Why the sandbox was destroyed: by you, idle timeout, maximum lifetime, failure, one-shot stop, or paused too long."
        network_updated:
          type: boolean
          nullable: true
          description: "`true` when the new egress rules were applied to the running sandbox."
      required:
        - id
        - name
        - template
        - size
        - status
        - region
        - specs
        - team
        - project_environment
        - auto_destroy
        - destroy_timeout
        - one_shot
        - block_outbound
        - egress
        - persistent
        - persistent_disk_gb
        - paused_at
        - from_snapshot
        - snapshot_mode
        - snapshot_frequency
        - created_at
        - last_activity_at
        - expires_at
        - destroyed_at
        - destroy_reason
    SearchBranchesResult:
      type: object
      properties:
        branches:
          type: array
