  /v1/domains/{domainId}/wildcard:
    patch:
      tags:
        - Domains
      summary: Enable or disable a wildcard domain
      operationId: enableOrDisableWildcardDomain
      description: |-
        Turns `*.yourdomain.com` on or off for a custom domain. The domain must be an apex domain (not a Brimble subdomain), attached to a project, on a plan that includes wildcard domains.

        For domains bought on Brimble, the DNS records are created for you and the wildcard is verified straight away. For other domains, add these records where your DNS is hosted (shown for `example.com`):

        | Type | Name | Value |
        |---|---|---|
        | CNAME | `*` | `gateway.brimble.app` |
        | CNAME | `_acme-challenge` | `example-com.acme.brimble.io` |
        | CNAME | `brimble-wc` | `gateway.brimble.app` (Cloudflare DNS only) |

        The exact values for your domain are returned in `settings.records` by `GET /v1/domains/{domain}`. On Cloudflare, set the records to DNS only (not proxied). Brimble checks pending wildcards every 2 minutes; the wildcard is active once `wildcard_verified` is `true`. See the [Wildcard domains guide](/domains/wildcard-domains).

        **API key scope:** `domain.update`

        **Team role permission:** `domain.update`
      parameters:
        - name: domainId
          in: path
          required: true
          description: ID of the domain.
          schema:
            type: string
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Turn the wildcard on or off.
                teamId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
              required:
                - enabled
      responses:
        '200':
          description: Domain wildcard updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
