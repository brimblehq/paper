openapi: 3.0.3
info:
  title: Brimble API
  version: 1.0.0
  description: |
    The Brimble API lets you deploy and manage projects, databases, domains, sandboxes, object storage and more.

    ## Base URL

    All endpoints are relative to `https://api.brimble.io/core`, for example `GET https://api.brimble.io/core/v1/projects`.

    ## Authentication

    Create an API key in the dashboard under **Settings → API keys** and send it in the `x-brimble-key` header:

    ```
    x-brimble-key: <your API key>
    ```

    Each API key carries permission scopes such as `project.read` or `project.deploy`. Every endpoint lists the scope it needs; a key without that scope gets `403`. Dashboard session tokens (`Authorization: Bearer <token>`) are also accepted, but integrations should use API keys.

    ## Teams

    Endpoints act on your personal workspace unless you pass a team. Most endpoints accept `teamId` (as a query parameter, or in the body for writes). API keys created for a team act in that team. Inside a team, your team role must also allow the action; each endpoint lists the team permission it checks.

    ## Responses

    Successful responses are JSON with this shape:

    ```json
    { "message": "Projects fetched", "data": { } }
    ```

    Errors return a `message`:

    ```json
    { "message": "Project not found", "data": {} }
    ```

    Requests that fail validation return `400` with every invalid field:

    ```json
    { "errors": [{ "type": "field", "msg": "Project name should be provided", "path": "name", "location": "body" }] }
    ```

    ## Rate limits

    Requests made with an API key are rate limited. Responses include `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset` and `X-RateLimit-Bucket`. Command execution and file transfer endpoints use separate buckets.

    ## Idempotency

    Endpoints that accept an `Idempotency-Key` header return the original result when retried with the same key and body, instead of repeating the operation.

    ## Streaming

    Command execution endpoints can stream output as Server-Sent Events (`text/event-stream`). Each event is `data: <json>` where the JSON has a `type` of `stdout`, `stderr`, `done` or `error`.

    ## Webhooks

    To receive events instead of polling, configure a webhook with `PATCH /v1/webhooks`. See the [Webhooks guide](/webhooks/overview) and the [Webhook events reference](/webhooks/events) for every payload.
  contact:
    name: Brimble
    url: https://brimble.io
servers:
  - url: https://api.brimble.io/core
    description: Production
security:
  - ApiKeyAuth: []
  - BearerAuth: []
tags:
  - name: Projects
    description: Create, deploy, configure and manage projects.
  - name: Deployments and Logs
    description: Deployment history, build logs and request logs.
  - name: Environments
    description: Project environments (production, staging, previews) and their variables.
  - name: Secrets
    description: Secrets (environment variables) set on a single project. Not to be confused with Environments, which group projects into production, staging and preview. Secret values are encrypted at rest and returned encrypted; use `POST /v1/decrypt` to read them.
  - name: Webhooks
    description: |-
      Receive events from Brimble at your own endpoint (or a Discord or Slack channel). Configure the destination and events with `PATCH /v1/webhooks`; use `*` to receive every event.

      See the [Webhooks guide](/webhooks/overview) for setup, and the [Webhook events reference](/webhooks/events) for the payload each event delivers.

      | Event | Sent when |
      | --- | --- |
      | `project.created` | A project is created |
      | `project.updated` | A project is updated |
      | `project.deleted` | A project is deleted |
      | `project.domain.updated` | A project domain changes |
      | `deployment.created` | A deployment is queued |
      | `deployment.started` | A deployment starts |
      | `deployment.success` | A deployment succeeds |
      | `deployment.failed` | A deployment fails |
      | `environment.variables.added` | Environment variables are added |
      | `environment.variables.updated` | Environment variables are updated |
      | `environment.variables.deleted` | Environment variables are deleted |
      | `domain.created` | A domain is added |
      | `domain.purchased` | A domain is purchased |
      | `domain.renewed` | A domain is renewed |
      | `domain.expired` | A domain expires |
      | `dns.record.created` | A DNS record is created |
      | `dns.record.updated` | A DNS record is updated |
      | `dns.record.deleted` | A DNS record is deleted |
      | `database.created` | A database is created |
      | `database.backup.completed` | A database backup completes |
      | `autoscaling.group.created` | An autoscaling rule is created |
      | `autoscaling.group.updated` | An autoscaling rule is updated |
      | `autoscaling.group.deleted` | An autoscaling rule is deleted |
      | `payment.successful` | A payment succeeds |
      | `payment.failed` | A payment fails |

      Test deliveries sent with `POST /v1/webhooks/test` include the header `X-Brimble-Test: true`.
  - name: Git Providers
    description: Connected git accounts, repositories and linking repositories to projects.
  - name: Domains
    description: Custom domains, DNS records and domain registration.
  - name: Databases
    description: 'Managed databases: provisioning, backups, users and linking to projects.'
  - name: Log Drains
    description: Stream logs to external destinations.
  - name: Sandboxes
    description: Isolated sandboxes for running code, with files and snapshots.
  - name: Object Storage
    description: S3-compatible buckets, objects and credentials.
  - name: Scaling and Networking
    description: Autoscaling rules, networking and CDN cache, and rate limits.
  - name: Teams
    description: Teams, members, invitations and roles.
  - name: Catalog
    description: Regions, frameworks and plans. No authentication required.
paths:
  /v1/accounts/{git}:
    get:
      tags:
        - Git Providers
      summary: List connected git provider accounts
      operationId: listConnectedGitProviderAccounts
      description: '**API key scope:** `user.read`'
      parameters:
        - name: git
          in: path
          required: true
          schema:
            type: string
            enum:
              - GITHUB
              - GITLAB
              - BITBUCKET
              - DOCKER
              - HUGGINGFACE
              - ORIGIN
          description: "Git provider: `GITHUB`, `GITLAB`, `BITBUCKET`, `HUGGINGFACE` or `ORIGIN` (Brimble Git). Case-insensitive."
        - name: installationId
          in: query
          required: false
          description: Only check this installation.
          schema:
            type: number
        - name: repoName
          in: query
          required: false
          description: Full repository name, for example `acme/web`, to check access to.
          schema:
            type: string
      responses:
        '200':
          description: Provider accounts found
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Provider accounts found
                  data:
                    type: object
                    description: The result of the request.
                    properties:
                      accounts:
                        type: array
                        description: Git accounts and organizations where the Brimble app is installed.
                        items:
                          $ref: '#/components/schemas/GitAccount'
                      authenticated:
                        type: boolean
                        description: "`true` when your Brimble account is connected to the Git provider."
                    required:
                      - accounts
                      - authenticated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/autoscaling:
    post:
      tags:
        - Scaling and Networking
      summary: Create an autoscaling rule
      operationId: createAutoscalingRule
      description: |-
        **API key scope:** `autoscaling.create`

        **Team role permission:** `autoscaling.create`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the autoscaling group.
                active:
                  type: boolean
                  description: "`true` scales between `min_containers` and `max_containers`; `false` runs a fixed number of `replicas`."
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 8
                  description: Fixed number of instances, 1 to 8. Required when `active` is `false`.
                min_containers:
                  type: integer
                  minimum: 1
                  description: Fewest instances to run, at least 1. Required when `active` is `true`.
                team_id:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
                max_containers:
                  type: integer
                  minimum: 1
                  description: Most instances to run. Must be greater than `min_containers`. Required when `active` is `true`.
                meta:
                  type: object
                  description: Free-form metadata to store with the group.
                max_memory:
                  type: integer
                  minimum: 30
                  description: Average memory usage, as a percentage (at least 30), above which another instance is added. Required when `active` is `true`.
                max_cpu:
                  type: integer
                  minimum: 30
                  description: Average CPU usage, as a percentage (at least 30), above which another instance is added. Required when `active` is `true`.
              required:
                - name
                - active
      responses:
        '201':
          description: Autoscaling group created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Autoscaling group created successfully
                  data:
                    $ref: '#/components/schemas/IAutoScalingGroup'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags:
        - Scaling and Networking
      summary: List autoscaling rules
      operationId: listAutoscalingRules
      description: |-
        **API key scope:** `autoscaling.read`

        **Team role permission:** `autoscaling.read`
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Autoscaling groups fetched successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Autoscaling groups fetched successfully
                  data:
                    type: array
                    description: The result of the request.
                    items:
                      $ref: '#/components/schemas/IAutoScalingGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/autoscaling/{id}:
    put:
      tags:
        - Scaling and Networking
      summary: Update an autoscaling rule
      operationId: updateAutoscalingRule
      description: |-
        **API key scope:** `autoscaling.update`

        **Team role permission:** `autoscaling.update`
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the autoscaling group.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the autoscaling group.
                active:
                  type: boolean
                  description: "`true` scales between `min_containers` and `max_containers`; `false` runs a fixed number of `replicas`."
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 8
                  description: Fixed number of instances, 1 to 8. Required when `active` is `false`.
                min_containers:
                  type: integer
                  minimum: 1
                  description: Fewest instances to run, at least 1. Required when `active` is `true`.
                team_id:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
                max_containers:
                  type: integer
                  minimum: 1
                  description: Most instances to run. Must be greater than `min_containers`. Required when `active` is `true`.
                meta:
                  type: object
                  description: Free-form metadata to store with the group.
                max_memory:
                  type: integer
                  minimum: 30
                  description: Average memory usage, as a percentage (at least 30), above which another instance is added. Required when `active` is `true`.
                max_cpu:
                  type: integer
                  minimum: 30
                  description: Average CPU usage, as a percentage (at least 30), above which another instance is added. Required when `active` is `true`.
              required:
                - name
                - active
      responses:
        '200':
          description: Group updated, redeploy your project to apply changes
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Group updated, redeploy your project to apply changes
                  data:
                    type: object
                    description: The result of the request.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/decrypt:
    post:
      tags:
        - Secrets
      summary: Decrypt secrets
      operationId: decryptSecrets
      description: |-
        Secrets are encrypted at rest, and the list endpoints return their values encrypted. Send those encrypted values here to get the plain text back.

        Pass each secret's `name` and `value` exactly as the list endpoint returned them. The response returns the same names with `value` decrypted. Treat the result as sensitive: don't log it or store it in plain text.

        **API key scope:** `env.read`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                environments:
                  type: array
                  description: Encrypted values to decrypt.
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                      - value
                    properties:
                      name:
                        type: string
                        description: Name of the variable. Returned unchanged so you can match results.
                      value:
                        type: string
                        description: Encrypted value, exactly as returned by the API.
              required:
                - environments
      responses:
        '200':
          description: Envs decrypted successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Envs decrypted successfully
                  data:
                    type: array
                    description: The result of the request.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Name of the variable.
                        value:
                          type: string
                          description: Plain value.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/domains:
    get:
      tags:
        - Domains
      summary: List domains
      operationId: listDomains
      description: '**API key scope:** `domain.read`'
      parameters:
        - name: environmentId
          in: query
          required: false
          description: Only return domains in this environment.
          schema:
            type: string
        - name: x-brimble-environment
          in: header
          required: false
          description: ID of the environment to scope the request to. Same as `environmentId`.
          schema:
            type: string
      responses:
        '200':
          description: Domains fetched successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Domains fetched successfully
                  data:
                    type: object
                    description: The result of the request.
                    properties:
                      domains:
                        type: array
                        description: Domains on this page.
                        items: {}
                      totalPages:
                        type: number
                        description: Number of pages at the requested `limit`.
                      currentPage:
                        type: number
                        description: Page returned.
                      filterBy:
                        type: string
                        description: Field the list is sorted by.
                    required:
                      - domains
                      - totalPages
                      - currentPage
                      - filterBy
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Domains
      summary: Add a domain to the workspace
      operationId: addDomain
      description: |-
        Adds a custom domain. Pass the project in the path to attach it to that project; without it the domain is added to the workspace only.

        **API key scope:** `domain.create`

        **Team role permission:** `domain.create`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Hostname to add, for example `app.example.com`. Subdomains of `brimble.app` are not allowed.
                  minLength: 3
                  maxLength: 63
                teamId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
                redirect:
                  type: object
                  properties:
                    url:
                      type: string
                      description: URL to redirect to, for example `https://www.example.com`.
                    status:
                      type: number
                      enum:
                        - 301
                        - 302
                        - 307
                        - 308
                      nullable: true
                      description: "HTTP status of the redirect: `301` or `308` (permanent), `302` or `307` (temporary)."
                  required:
                    - url
                  nullable: true
                  description: Redirect this domain to another URL instead of serving the project. Send `null` to remove the redirect.
              required:
                - name
      responses:
        '201':
          description: Domain created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Domain created successfully
                  data:
                    description: The result of the request.
                    oneOf:
                      - $ref: '#/components/schemas/IDomain'
                      - type: array
                        items:
                          $ref: '#/components/schemas/IDomain'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/domains/sale/purchase:
    post:
      tags:
        - Domains
      summary: Purchase a domain
      operationId: purchaseDomain
      description: |-
        **API key scope:** `domain.create`

        **Team role permission:** `domain.create`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Domain to buy, for example `example.com`.
                  minLength: 3
                  maxLength: 63
                duration:
                  type: integer
                  description: Years to register the domain for. 1 to 10.
                  minimum: 1
                  maximum: 10
                projectId:
                  type: string
                  description: Project to attach the domain to after purchase.
                  pattern: ^[a-fA-F0-9]{24}$
                teamId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
                privacyEnabled:
                  type: boolean
                  description: Hide your contact details from the public WHOIS record.
                autoRenewal:
                  type: boolean
                  description: Renew the domain automatically before it expires.
                couponCode:
                  type: string
                  description: Coupon code to apply to the purchase.
                  minLength: 1
                  maxLength: 40
                paymentProvider:
                  type: string
                  description: "How to pay: `stripe` (card) or `blockradar` (stablecoin). Stablecoin payments return a payment link to complete."
                  enum:
                    - stripe
                    - blockradar
              required:
                - name
                - duration
                - privacyEnabled
                - autoRenewal
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/DomainPurchasePendingResponse'
                      - $ref: '#/components/schemas/DomainPurchaseSuccessResponse'
                    nullable: true
                    description: The result of the request.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/domains/sale/search:
    post:
      tags:
        - Domains
      summary: Search domains for sale
      operationId: searchDomainsForSale
      description: '**API key scope:** `domain.read`'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  nullable: true
                  description: Domain or keyword to search for, for example `example.com`.
      responses:
        '200':
          description: Available domain(s)
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Available domain(s)
                  data:
                    type: array
                    description: The result of the request.
                    items:
                      type: object
                      properties:
                        purchasePrice:
                          description: Price for the first year, in USD.
                        domainName:
                          description: Full domain name.
                        sld:
                          description: Second-level part, for example `example` in `example.com`.
                        tld:
                          description: Top-level domain, for example `com`.
                        purchasable:
                          description: "`true` when the domain is available to buy."
                        purchaseType:
                          description: How the domain is acquired, for example `registration`.
                        previousPrice:
                          description: Price before any discount, in USD.
                        renewalPrice:
                          description: Yearly renewal price, in USD.
                        isDiscounted:
                          description: "`true` when `purchasePrice` is discounted."
                        privacySupported:
                          description: "`true` when WHOIS privacy is available for this domain."
                        minRegistrationYears:
                          description: Fewest years the domain can be registered for.
                      required:
                        - purchasePrice
                        - domainName
                        - sld
                        - tld
                        - purchasable
                        - purchaseType
                        - previousPrice
                        - renewalPrice
                        - isDiscounted
                        - privacySupported
                        - minRegistrationYears
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/domains/{domainId}:
    delete:
      tags:
        - Domains
      summary: Delete a domain
      operationId: deleteDomain
      description: |-
        Deletes a custom domain you added. Domains bought on Brimble and `*.brimble.app` subdomains can't be deleted.

        **API key scope:** `domain.delete`

        **Team role permission:** `domain.delete`
      parameters:
        - name: domainId
          in: path
          required: true
          description: ID of the domain.
          schema:
            type: string
      responses:
        '200':
          description: Domain deleted successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Domain deleted successfully
                  data:
                    type: object
                    description: The result of the request.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Domains
      summary: Update a domain
      operationId: updateDomain
      description: |-
        **API key scope:** `domain.update`

        **Team role permission:** `domain.update`
      parameters:
        - name: domainId
          in: path
          required: true
          description: ID of the domain.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Hostname to add, for example `app.example.com`. Subdomains of `brimble.app` are not allowed.
                  minLength: 3
                  maxLength: 63
                teamId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
                redirect:
                  type: object
                  properties:
                    url:
                      type: string
                      description: URL to redirect to, for example `https://www.example.com`.
                    status:
                      type: number
                      enum:
                        - 301
                        - 302
                        - 307
                        - 308
                      nullable: true
                      description: "HTTP status of the redirect: `301` or `308` (permanent), `302` or `307` (temporary)."
                  required:
                    - url
                  nullable: true
