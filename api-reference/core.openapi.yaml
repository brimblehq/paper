          items:
            type: object
            properties:
              id:
                type: number
                description: Job ID.
              name:
                type: string
                description: Job name.
            required:
              - id
              - name
        environment:
          type: string
          description: "`PRODUCTION` for the main branch, `PREVIEW` for previews."
          enum:
            - PREVIEW
            - PRODUCTION
        preview:
          $ref: '#/components/schemas/IPreview'
        startTime:
          description: When the build started.
          oneOf:
            - type: string
            - type: string
              format: date-time
        endTime:
          description: When the deployment finished. `null` while it is running.
          oneOf:
            - type: string
            - type: string
              format: date-time
        createdAt:
          description: When the deployment was created.
          oneOf:
            - type: string
            - type: string
              format: date-time
        updatedAt:
          description: When the deployment was last changed.
          oneOf:
            - type: string
            - type: string
              format: date-time
        deleted:
          type: boolean
          description: "`true` when the deployment was deleted."
        _id:
          $ref: '#/components/schemas/ObjectId'
      required:
        - name
        - key
        - commit
        - source
        - status
        - project
        - jobs
        - environment
        - preview
        - startTime
        - endTime
        - createdAt
        - updatedAt
        - deleted
        - _id
    IMember:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/IUser'
        team:
          $ref: '#/components/schemas/ITeam'
        role:
          type: string
          description: Member's role in the team.
          enum:
            - CREATOR
            - ADMINISTRATOR
            - MEMBER
            - VIEWER
            - CUSTOM
        accepted:
          type: boolean
          description: "`true` once the member accepted the invitation."
        invitedBy:
          $ref: '#/components/schemas/IUser'
        email:
          type: string
          description: Member's email address.
        featureOnboarded:
          type: boolean
          description: "`true` once the member finished the dashboard onboarding."
        custom_role:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/IRole'
          nullable: true
          description: Custom role, when `role` is `CUSTOM`.
        project_environments:
          type: array
          description: Environments the member can access, when their role is limited to some environments.
          items:
            $ref: '#/components/schemas/IProjectEnvironment'
        createdAt:
          type: string
          format: date-time
          description: When the member was invited (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          description: When the membership was last changed (ISO 8601).
        _id:
          $ref: '#/components/schemas/ObjectId'
      required:
        - user
        - team
        - role
        - accepted
        - invitedBy
        - email
        - featureOnboarded
        - project_environments
        - createdAt
        - updatedAt
        - _id
    IOrigin:
      type: object
      properties:
        installation_id:
          type: string
          description: Installation ID of the Brimble Git app.
        namespace_id:
          type: string
          nullable: true
          description: Namespace (owner) ID in Brimble Git.
        repository_selection:
          type: string
          enum:
            - all
            - selected
          nullable: true
          description: "`all` gives access to every repository; `selected` only to chosen ones."
      required:
        - installation_id
    IPasswordRotation:
      type: object
      properties:
        applied:
          type: boolean
          nullable: true
          description: "`true` once the new password is applied to the database."
        vaultSynced:
          type: boolean
          nullable: true
          description: "`true` once the new password is saved to Brimble's secret store."
    IPendingMqEvent:
      type: object
      properties:
        event:
          type: string
          description: Name of the queued operation.
        data:
          type: object
          description: Payload of the queued operation.
          additionalProperties: {}
        messageId:
          type: string
          nullable: true
          description: ID of the queued message.
        createdAt:
          type: string
          format: date-time
          description: When the operation was queued (ISO 8601).
      required:
        - event
        - data
        - createdAt
    IPgBouncerConfig:
      type: object
      properties:
        defaultPoolSize:
          type: number
          description: Server connections per user and database pair. 1 to 100.
        maxDbConnections:
          type: number
          description: Maximum server connections per database. 0 to 500; 0 means no limit.
        maxDbClientConnections:
          type: number
          description: Maximum client connections per database. 0 to 5000; 0 means no limit.
        maxUserConnections:
          type: number
          description: Maximum server connections per user. 0 to 500; 0 means no limit.
        maxClientConn:
          type: number
          description: Maximum client connections PgBouncer accepts in total. 1 to 10000.
        maxPreparedStatements:
          type: number
          description: Prepared statements tracked per connection, for transaction pooling. 0 to 10000; 0 turns tracking off.
        serverLifetime:
          type: number
          description: Close server connections older than this, in seconds. 60 to 86400.
        serverIdleTimeout:
          type: number
          description: Close server connections idle for longer than this, in seconds. 10 to 86400.
      required:
        - defaultPoolSize
        - maxDbConnections
        - maxDbClientConnections
        - maxUserConnections
        - maxClientConn
        - maxPreparedStatements
        - serverLifetime
        - serverIdleTimeout
    IPreview:
      type: object
      properties:
        name:
          type: string
          description: Preview name, for example `pr12-my-app`.
        healthCheckPath:
          type: string
          nullable: true
          description: HTTP path used to check the preview is healthy.
        pid:
          type: number
          description: Internal. Process ID used by the legacy runtime.
        port:
          type: number
          description: Port the preview listens on inside the container.
        ip:
          type: string
          description: Internal IP address of the preview.
        http2:
          type: boolean
          description: "`true` when Brimble talks to the preview over HTTP/2."
        dir:
          type: string
          description: Internal. Build directory on the build server.
        branch:
          type: string
          description: Git branch the preview was built from.
        pr_number:
          type: number
          nullable: true
          description: Pull request number, when the preview is for a pull request.
        server:
          $ref: '#/components/schemas/IServer'
        project:
          $ref: '#/components/schemas/IProject'
        issue_comment_id:
          type: number
          description: ID of the pull request comment Brimble posted with the preview link.
        status:
          type: string
          description: Status of the preview's latest deployment.
          enum:
            - AWAITING_CONFIG_APPROVAL
            - INACTIVE
            - ACTIVE
            - INPROGRESS
            - FAILED
            - PENDING
            - CANCELLED
            - SUPERSEDED
            - DEGRADED
            - PAYMENT DUE
            - NOMAD_READY
            - NOMAD_FAILED
        log:
          $ref: '#/components/schemas/ILog'
        last_requested:
          type: string
          format: date-time
          description: When the preview last received a request (ISO 8601).
        isPaused:
          type: boolean
          description: "`true` when the preview is paused."
        _id:
          $ref: '#/components/schemas/ObjectId'
      required:
        - name
        - pid
        - port
        - ip
        - http2
        - dir
        - branch
        - server
        - project
        - issue_comment_id
        - status
        - log
        - last_requested
        - isPaused
        - _id
    IPreviewCollaboration:
