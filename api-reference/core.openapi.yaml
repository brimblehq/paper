  /v1/webhooks:
    patch:
      tags:
        - Webhooks
      summary: Update webhook settings
      operationId: updateWebhookSettings
      description: |-
        Sets where events are delivered and which events to send. Use `["*"]` to receive every event. See the [Webhooks guide](/webhooks/overview) for setup and the [Webhook events reference](/webhooks/events) for each payload.

        **API key scope:** `webhook.update`

        **Team role permission:** `webhook.update`
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                webhookUrl:
                  type: string
                  format: uri
                  description: Webhook URL must be a valid URL
                discordUrl:
                  type: string
                  format: uri
                  description: Discord URL must be a valid URL
                slackUrl:
                  type: string
                  format: uri
                  description: Slack URL must be a valid URL
                events:
                  type: array
                  items:
                    type: string
                    enum:
                      - '*'
                      - project.created
                      - project.updated
                      - project.deleted
                      - project.domain.updated
                      - deployment.created
                      - deployment.started
                      - deployment.success
                      - deployment.failed
                      - environment.variables.added
                      - environment.variables.updated
                      - environment.variables.deleted
                      - domain.created
                      - domain.purchased
                      - domain.renewed
                      - domain.expired
                      - dns.record.created
                      - dns.record.updated
                      - dns.record.deleted
                      - database.created
                      - database.backup.completed
                      - autoscaling.group.created
                      - autoscaling.group.updated
                      - autoscaling.group.deleted
                      - payment.successful
                      - payment.failed
              required:
                - events
      responses:
        '200':
          description: Webhooks updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Webhooks updated successfully
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags:
        - Webhooks
      summary: Get webhook settings
      operationId: getWebhookSettings
      description: |-
        **API key scope:** `webhook.read`

        **Team role permission:** `webhook.read`
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Webhooks fetched successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Webhooks fetched successfully
                  data:
                    type: object
                    properties:
                      supported:
                        type: boolean
                      webhookUrl:
                        type: string
                      discordUrl:
                        type: string
                      slackUrl:
                        type: string
                      events:
                        type: array
                        items: {}
                    required:
                      - supported
                      - webhookUrl
                      - discordUrl
                      - slackUrl
                      - events
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
