      required:
        - first_name
        - last_name
        - email
        - username
        - email_verified_at
        - ai_usage_count
        - github
        - gitlab
        - location
        - interests
        - bitbucket
        - following
        - projects
        - teams
        - avatar
        - freeTrialActive
        - activated
        - is_waitlist
        - build_disabled
        - build_disabled_by
        - sandbox_disabled
        - sandbox_disabled_by
        - spending_limit
        - spending_limit_action
        - spending_limit_breached_at
        - build_minutes
        - llm_tokens
        - llm_tokens_used
        - llm_tokens_team_granted
        - disabled
        - disabled_at
        - has_payment_method
        - notifications
        - agent_byok_enabled
        - created_at
        - updated_at
        - _id
    IVolume:
      type: object
      properties:
        name:
          type: string
          description: Name of the volume.
        user:
          allOf:
            - $ref: '#/components/schemas/IUser'
          nullable: true
          description: User who owns the volume.
        team:
          allOf:
            - $ref: '#/components/schemas/ITeam'
          nullable: true
          description: Team that owns the volume.
        namespace:
          type: string
          description: Internal. Scheduler namespace.
        size:
          type: number
          description: Size of the volume, in GB.
        type:
          type: string
          description: What the volume is used by.
        mount_path:
          type: string
          nullable: true
          description: Path where the volume is mounted.
        csi_volume_id:
          type: string
          nullable: true
          description: Internal. Storage volume ID.
        region:
          allOf:
            - $ref: '#/components/schemas/IRegion'
          nullable: true
          description: Region the volume is in.
        attached_sandbox_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: Sandbox the volume is attached to, if any.
        attached_project_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: Project the volume is attached to, if any.
        last_attached_at:
          type: string
          format: date-time
          nullable: true
          description: When the volume was last attached (ISO 8601).
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: When the volume was deleted (ISO 8601).
        created_at:
          type: string
          format: date-time
          nullable: true
          description: When the volume was created (ISO 8601).
        updated_at:
          type: string
