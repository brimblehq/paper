    IDatabaseProvisionProgress:
      type: object
      properties:
        phase:
          type: string
          description: Overall phase of the operation.
          enum:
            - preparing
            - provisioning
            - ready
            - failed
        message:
          type: string
          description: Human-readable description of the current step.
        step:
          type: string
          description: Current step of the operation.
          enum:
            - queued
            - saving-credentials
            - choosing-host
            - reserving-port
            - creating-storage
            - checking-capacity
            - handing-off
            - applying-config
            - preparing-runtime
            - registering-job
            - waiting-healthy
            - preparing-cluster
            - registering-member
            - waiting-member
            - initializing-replica-set
            - ready
            - failed
        operation:
          type: string
          description: "`create` for a new database, `retry` after a failure, `refresh` when settings change."
          enum:
            - create
            - retry
            - refresh
        memberIndex:
          type: number
          nullable: true
          description: "High-availability clusters only: which member is being provisioned, starting at 0."
        updatedAt:
          type: string
          format: date-time
          description: When the progress last changed (ISO 8601).
      required:
        - phase
        - message
        - step
        - operation
        - updatedAt
    IDbImage:
      type: object
      properties:
        name:
          type: string
          description: Database engine.
          enum:
            - mysql
            - postgresql
            - mongodb
            - redis
            - wordpress
            - sqlite
            - duckdb
        image_url:
          type: string
          description: Logo URL of the engine.
        version:
          type: string
          description: Engine version, for example `16`.
        envs:
          type: array
          description: Environment variables the engine image expects.
          items:
            type: object
            properties:
              value:
                type: string
                description: Variable name or default value.
              type:
                type: string
                description: What the variable holds, for example the user, password or database name.
            required:
              - value
              - type
        is_available:
          type: boolean
          description: "`true` when the engine can be deployed."
        is_default:
          type: boolean
          description: "`true` for the version picked when none is specified."
        backup_supported:
          type: boolean
          description: "`true` when backups are supported."
        restore_supported:
          type: boolean
          description: "`true` when restoring from a backup is supported."
        pgbouncer_supported:
          type: boolean
          description: "`true` when PgBouncer pooling is supported."
        pgvector_supported:
          type: boolean
          description: "`true` when the pgvector extension is available."
        manage_user:
          type: boolean
          description: "`true` when extra database users can be created."
        image:
          type: string
          description: Container image used for single-node deployments.
        ha_image:
          type: string
          nullable: true
          description: Container image used for high-availability clusters.
        free:
          type: boolean
          description: "`true` when the engine is available on the free plan."
        erd:
          type: boolean
          description: "`true` when the dashboard can show an entity-relationship diagram."
        analytics:
          type: boolean
          description: "`true` when database insights are available."
        has_port:
          type: boolean
          description: "`true` when the engine listens on a network port."
        port:
          type: number
          description: Port the engine listens on.
        httpPort:
          type: number
          nullable: true
          description: HTTP port, for engines with a web interface.
        volumePath:
          type: string
          description: Path where data is stored inside the container.
        protocol:
          description: Connection string scheme, for example `postgresql`.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        tls_enabled:
          type: boolean
          description: "`true` when the engine supports TLS."
        tls_protocol:
          type: string
          nullable: true
          description: Connection string scheme to use with TLS, for example `rediss`.
        tls_params:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
          nullable: true
          description: Query parameters added to TLS connection strings.
        connection:
          allOf:
            - $ref: '#/components/schemas/IDbImageConnection'
          nullable: true
          description: How connection strings are built for this engine.
        ha:
          type: boolean
          description: "`true` when high-availability clusters are supported."
        workbench:
          type: boolean
          description: "`true` when the in-dashboard workbench is supported."
        workbench_mode:
          type: string
          description: "Workbench type: `sql`, `kv` (key-value) or `document`."
          enum:
            - sql
            - kv
            - document
        password_mode:
          type: string
          description: "`provided` means you choose the password; `generated` means Brimble creates it."
          enum:
            - provided
            - generated
        password_change_mode:
          type: string
          description: "`live` changes the password without a restart; `template` redeploys the database."
          enum:
            - live
            - template
        httpTitle:
          type: string
          description: Title shown for the web interface.
        httpSubtext:
          type: string
          description: Subtitle shown for the web interface.
        params:
          type: object
          description: Default connection string query parameters.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        recommendations:
          type: array
          description: Suggested resource sizes.
          items:
            type: object
            properties:
              cpu:
                type: string
                description: Suggested CPU, in vCPUs.
              memory:
                type: string
                description: Suggested memory, in GB.
              storage:
                type: string
                description: Suggested disk, in GB.
            required:
              - cpu
              - memory
              - storage
        _id:
          $ref: '#/components/schemas/ObjectId'
      required:
        - name
        - image_url
        - version
        - envs
        - is_available
        - is_default
        - backup_supported
        - restore_supported
        - pgbouncer_supported
        - pgvector_supported
        - manage_user
        - image
        - free
        - erd
        - analytics
        - has_port
        - port
        - volumePath
        - protocol
        - tls_enabled
        - ha
        - workbench
        - workbench_mode
        - password_mode
        - password_change_mode
        - httpTitle
        - httpSubtext
        - params
        - recommendations
        - _id
