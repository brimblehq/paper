                              hosts:
                                type: array
                                description: Hostnames the settings were applied to.
                                items:
                                  type: string
                              message:
                                type: string
                                description: Details when the settings could not be applied.
                              zones:
                                nullable: true
                                description: Edge zones that were updated.
                            required:
                              - synced
                              - hosts
                              - message
                          - type: object
                            properties:
                              synced:
                                type: boolean
                                description: "`true` when the settings were applied."
                              hosts:
                                type: array
                                description: Hostnames the settings were applied to.
                                items:
                                  type: string
                              zones:
                                type: array
                                description: Edge zones that were updated.
                                items:
                                  type: object
                              message:
                                nullable: true
                                description: Details when the settings could not be applied.
                            required:
                              - synced
                              - hosts
                              - zones
                    required:
                      - settings
                      - hosts
                      - sync
