    patch:
      tags:
        - Scaling and Networking
      summary: Update networking settings
      operationId: updateNetworkingSettings
      description: |-
        **API key scope:** `networking.update`

        **Team role permission:** `networking.update`
      parameters:
        - name: projectId
          in: path
          required: true
          description: ID of the project.
          schema:
            type: string
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cache:
                  type: object
                  description: Edge caching.
                  properties:
                    purgeOnDeploy:
                      type: boolean
                      description: Clear the edge cache after each deployment. Defaults to `true`.
                    bypassCache:
                      type: boolean
                      description: Never cache responses at the edge.
                responseRules:
                  type: object
                  description: Security headers added to every response.
                  properties:
                    xFrameOptions:
                      enum:
                        - DENY
                        - SAMEORIGIN
                        - disabled
                      type: string
                      description: Value of the `X-Frame-Options` header. `DENY` blocks framing; `SAMEORIGIN` allows it from your own site; `disabled` sends nothing.
                    xContentTypeOptions:
                      enum:
                        - nosniff
                        - disabled
                      type: string
                      description: "`nosniff` sends `X-Content-Type-Options: nosniff`; `disabled` sends nothing."
                    xRobotsTag:
                      enum:
                        - index, follow
                        - noindex, nofollow
                        - noindex, follow
                        - index, nofollow
                        - disabled
                      type: string
                      description: Value of the `X-Robots-Tag` header, which tells search engines whether to index pages and follow links. `disabled` sends nothing.
                    hstsEnabled:
                      type: boolean
                      description: "Send `Strict-Transport-Security: max-age=63072000; includeSubDomains; preload`, so browsers only use HTTPS."
                    markdownForAgents:
                      type: boolean
                      description: Return pages as Markdown to AI agents that request `text/markdown`.
                firewall:
                  type: object
                  description: Edge firewall.
                  properties:
                    pathBlocking:
                      type: boolean
                      description: Block requests to sensitive paths such as `/.env`, `/.git` and `/phpmyadmin`, and WordPress admin paths on non-WordPress sites.
                    browserIntegrityCheck:
                      type: boolean
                      description: Block requests with headers commonly used by bots and spammers.
                    underAttackMode:
                      type: boolean
                      description: Show visitors a browser challenge before they reach the site. Use during an attack.
                    wordpressProtection:
                      type: boolean
                      description: Block common WordPress attacks (fake logins, XML-RPC, known exploit paths) and rate limit the login page.
                teamId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
      responses:
        '200':
          description: Network settings updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Network settings updated
                  data:
                    type: object
                    description: The result of the request.
                    properties:
                      settings:
                        type: object
                        description: Network settings of the project.
                        properties:
                          id:
                            type: string
                            description: ID of the settings.
                          project:
                            type: string
                            description: ID of the project.
                          cache:
                            type: object
                            description: Edge caching.
                            properties:
                              purgeOnDeploy:
                                type: boolean
                                description: Clear the edge cache after each deployment. Defaults to `true`.
                              bypassCache:
                                type: boolean
                                description: Never cache responses at the edge.
                            required:
                              - purgeOnDeploy
                              - bypassCache
                          responseRules:
                            type: object
                            description: Security headers added to every response.
                            properties:
                              xFrameOptions:
                                type: string
                                description: Value of the `X-Frame-Options` header. `DENY` blocks framing; `SAMEORIGIN` allows it from your own site; `disabled` sends nothing.
                                enum:
                                  - DENY
                                  - SAMEORIGIN
                                  - disabled
                              xContentTypeOptions:
                                type: string
                                description: "`nosniff` sends `X-Content-Type-Options: nosniff`; `disabled` sends nothing."
                                enum:
                                  - nosniff
                                  - disabled
                              xRobotsTag:
                                type: string
                                description: Value of the `X-Robots-Tag` header, which tells search engines whether to index pages and follow links. `disabled` sends nothing.
                                enum:
                                  - index, follow
                                  - noindex, nofollow
                                  - noindex, follow
                                  - index, nofollow
                                  - disabled
                              hstsEnabled:
                                type: boolean
                                description: "Send `Strict-Transport-Security: max-age=63072000; includeSubDomains; preload`, so browsers only use HTTPS."
                              markdownForAgents:
                                type: boolean
                                description: Return pages as Markdown to AI agents that request `text/markdown`.
                            required:
                              - xFrameOptions
                              - xContentTypeOptions
                              - xRobotsTag
                              - hstsEnabled
                              - markdownForAgents
                          firewall:
                            type: object
                            description: Edge firewall.
                            properties:
                              pathBlocking:
                                type: boolean
                                description: Block requests to sensitive paths such as `/.env`, `/.git` and `/phpmyadmin`, and WordPress admin paths on non-WordPress sites.
                              browserIntegrityCheck:
                                type: boolean
                                description: Block requests with headers commonly used by bots and spammers.
                              underAttackMode:
                                type: boolean
                                description: Show visitors a browser challenge before they reach the site. Use during an attack.
                              wordpressProtection:
                                type: boolean
                                description: Block common WordPress attacks (fake logins, XML-RPC, known exploit paths) and rate limit the login page.
                            required:
                              - pathBlocking
                              - browserIntegrityCheck
                              - underAttackMode
                              - wordpressProtection
                          cloudflare:
                            type: object
                            description: Sync state with the edge.
                            properties:
                              lastSyncedAt:
                                type: string
                                format: date-time
                                nullable: true
                                description: When the settings were last applied at the edge (ISO 8601).
                              syncError:
                                type: string
                                nullable: true
                                description: Error from the last sync, if any.
                        required:
                          - id
                          - project
