          description: Encrypted value. Use `POST /v1/decrypt` to read it.
        project:
          $ref: '#/components/schemas/IProject'
        user:
          $ref: '#/components/schemas/IUser'
        environment:
          type: string
          description: "`PRODUCTION` or `PREVIEW`."
        is_system:
          type: boolean
          nullable: true
          description: "`true` for secrets Brimble sets itself, such as linked database credentials."
        createdAt:
          type: string
          format: date-time
          description: When the secret was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          description: When the secret was last changed (ISO 8601).
        _id:
          $ref: '#/components/schemas/ObjectId'
      required:
        - name
        - value
        - project
        - user
        - environment
        - createdAt
        - updatedAt
        - _id
    SecretInput:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          example: DATABASE_URL
          description: Must start with a letter or underscore and contain only letters, numbers and underscores.
        value:
          type: string
          description: Plain value of the secret. It is encrypted at rest.
          example: postgres://…
    SnapshotResponse:
      type: object
      properties:
        id:
          type: string
          description: ID of the snapshot.
        sandbox_id:
          type: string
          description: ID of the sandbox the snapshot was taken from.
        name:
          type: string
          description: Name of the snapshot.
        image_tag:
          type: string
          description: Image tag that stores the snapshot.
        source_template:
          type: string
          description: Template the source sandbox was created from.
        status:
          type: string
          description: "`creating` while the snapshot is being taken, then `ready` or `failed`."
          enum:
            - ready
            - failed
            - creating
        failure_reason:
          type: string
          nullable: true
          description: Why the snapshot failed.
        size_bytes:
          type: number
          nullable: true
          description: Size of the snapshot, in bytes.
        created_at:
          type: string
          format: date-time
          description: When the snapshot was taken (ISO 8601).
      required:
        - id
        - sandbox_id
        - name
        - image_tag
        - source_template
        - status
        - failure_reason
        - size_bytes
        - created_at
    StorageBucketCapabilities:
      type: object
      properties:
        cors:
          type: boolean
          description: "`true` when the bucket supports CORS rules."
        publicToggle:
          type: boolean
          description: "`true` when the bucket can be made public."
        customDomain:
          type: boolean
          description: "`true` when a custom domain can serve the bucket."
        lifecycle:
          type: boolean
          description: "`true` when lifecycle rules are supported."
        versioning:
          type: boolean
          description: "`true` when object versioning is supported."
        bucketPolicy:
          type: boolean
          description: "`true` when bucket policies are supported."
        objectAcl:
          type: boolean
          description: "`true` when per-object access control lists are supported."
        publicWebsite:
          type: boolean
          description: "`true` when the bucket can be served as a static website."
        copyObject:
          type: boolean
          description: "`true` when server-side object copy is supported."
        objectTagging:
          type: boolean
          description: "`true` when object tags are supported."
        notifications:
          type: boolean
          description: "`true` when event notifications are supported."
        replication:
          type: boolean
          description: "`true` when replication to another bucket is supported."
        select:
          type: boolean
          description: "`true` when S3 Select queries are supported."
        objectLock:
          type: boolean
          description: "`true` when object lock (write-once) is supported."
        inventory:
          type: boolean
          description: "`true` when inventory reports are supported."
        nativeIam:
          type: boolean
          description: "`true` when the provider's own IAM policies are supported."
      required:
