        requiresReauthorization:
          type: boolean
          description: "`true` when you must reconnect the Git account to restore access."
        provider:
          type: string
          enum:
            - GITHUB
            - GITLAB
            - BITBUCKET
            - DOCKER
            - HUGGINGFACE
            - ORIGIN
          nullable: true
          description: Git provider checked.
        repo:
          type: string
          nullable: true
          description: Full repository name checked, for example `acme/web`.
        installationId:
          oneOf:
            - type: string
            - type: number
          nullable: true
          description: Git provider app installation used for the check.
        reason:
          type: string
          enum:
            - no_repo_linked
            - no_git_account
            - invalid_installation
            - installation_not_found
            - installation_not_authorized
            - token_revoked
            - token_expired
            - repo_access_denied
            - repo_not_found
          nullable: true
          description: Why access failed. Absent when `connected` is `true`.
        message:
          type: string
          nullable: true
          description: Human-readable explanation of the result.
