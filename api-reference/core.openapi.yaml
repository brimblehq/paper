                    description: Human-readable result of the request.
                    example: Member role updated
                  data:
                    type: object
                    description: The result of the request.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/webhooks:
    patch:
      tags:
        - Webhooks
      summary: Update webhook settings
      operationId: updateWebhookSettings
      description: |-
        Sets where events are delivered and which events to send. Use `["*"]` to receive every event. See the [Webhooks guide](/webhooks/overview) for setup and the [Webhook events reference](/webhooks/events) for each payload.

        **API key scope:** `webhook.update`

        **Team role permission:** `webhook.update`
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                webhookUrl:
                  type: string
                  format: uri
                  description: URL that receives webhook events as JSON `POST` requests. Send `null` to turn it off.
                discordUrl:
                  type: string
                  format: uri
                  description: Discord webhook URL that receives event messages. Send `null` to turn it off.
                slackUrl:
                  type: string
                  format: uri
                  description: Slack incoming webhook URL that receives event messages. Send `null` to turn it off.
                events:
                  type: array
                  description: Names of the events to send. See the [Webhook events reference](/webhooks/events).
                  items:
                    type: string
                    enum:
                      - '*'
                      - project.created
                      - project.updated
                      - project.deleted
                      - project.domain.updated
                      - deployment.created
                      - deployment.started
                      - deployment.success
                      - deployment.failed
                      - environment.variables.added
                      - environment.variables.updated
                      - environment.variables.deleted
                      - domain.created
                      - domain.purchased
                      - domain.renewed
                      - domain.expired
                      - dns.record.created
                      - dns.record.updated
                      - dns.record.deleted
                      - database.created
                      - database.backup.completed
                      - autoscaling.group.created
                      - autoscaling.group.updated
                      - autoscaling.group.deleted
                      - payment.successful
                      - payment.failed
              required:
                - events
      responses:
        '200':
          description: Webhooks updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Webhooks updated successfully
                  data:
                    type: object
                    description: The result of the request.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags:
        - Webhooks
      summary: Get webhook settings
      operationId: getWebhookSettings
      description: |-
        **API key scope:** `webhook.read`

        **Team role permission:** `webhook.read`
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Webhooks fetched successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Webhooks fetched successfully
                  data:
                    type: object
                    description: The result of the request.
                    properties:
                      supported:
                        type: boolean
                        description: "`true` when your plan includes webhooks."
                      webhookUrl:
                        type: string
                        description: URL that receives webhook events.
                      discordUrl:
                        type: string
                        description: Discord webhook URL.
                      slackUrl:
                        type: string
                        description: Slack webhook URL.
                      events:
                        type: array
                        description: Events that are sent.
                        items: {}
                    required:
                      - supported
                      - webhookUrl
                      - discordUrl
                      - slackUrl
                      - events
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/webhooks/test:
    post:
      tags:
        - Webhooks
      summary: Send a test webhook
      operationId: sendTestWebhook
      description: |-
        **API key scope:** `webhook.update`

        **Team role permission:** `webhook.update`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: URL to send the test event to.
                payload:
                  type: object
                  additionalProperties: true
                  description: Body to send in the test webhook.
                type:
                  enum:
                    - webhook
                    - discord
                    - slack
                  type: string
                  description: "Kind of destination: `webhook` (JSON `POST`), `discord` or `slack`."
              required:
                - url
                - type
      responses:
        '200':
          description: Webhook test sent successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Webhook test sent successfully
                  data:
                    type: object
                    description: The result of the request.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-brimble-key
      description: API key created in the dashboard under Settings → API keys. Each key carries permission scopes; every endpoint lists the scope it needs.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Dashboard session token. Use an API key for integrations.
  schemas:
    CloneEnvironmentInclude:
      type: object
      properties:
        variables:
          type: boolean
          description: Copy the environment's shared variables.
        projects:
          type: boolean
          description: Copy the projects in the environment, with their settings and secrets.
        sandboxes:
          type: boolean
          description: Copy the sandboxes in the environment.
        buckets:
          type: boolean
          description: Create matching storage buckets (objects are not copied).
      required:
        - variables
        - projects
        - sandboxes
        - buckets
    ComputeConfigurations:
      type: object
      properties:
        cpu:
          type: number
          description: CPU, in vCPUs. Between the plan minimum and 8.
        memory:
          type: number
          description: Memory, in GB. Between the plan minimum and 16.
        storage:
          type: number
          description: Disk, in GB. 0.5 to 150 for apps; 10 to 50 for databases.
        region:
          type: string
          nullable: true
          description: ID of the region to run in. See `GET /v1/regions`. Optional for static sites.
      required:
        - cpu
        - memory
        - storage
    ConfigManagedFields:
      type: object
      properties:
        path:
          type: string
          description: Path of the `brimble.toml` file in the repository.
        fields:
          type: array
          description: Project fields controlled by the file. Changing them through the API is overwritten on the next apply.
          items:
            type: string
        commit:
          type: string
          description: Commit SHA the file was last applied from.
        applied_at:
          type: string
          format: date-time
          description: When the file was last applied (ISO 8601).
      required:
        - path
        - fields
        - commit
        - applied_at
    ConsulHealthStatus:
      type: object
      properties:
        status:
          type: string
          description: "Health check result: `passing`, `warning` or `critical`."
        statusCode:
          type: number
          nullable: true
          description: HTTP status code returned by the health check path.
      required:
        - status
    CorsRule:
      type: object
      properties:
        allowedHeaders:
          type: array
          items:
            type: string
          nullable: true
          description: Request headers browsers may send, for example `Content-Type`. `*` allows any header.
        allowedMethods:
          type: array
          items:
            type: string
          nullable: true
          description: "HTTP methods browsers may use: `GET`, `HEAD`, `PUT`, `POST` or `DELETE`."
        allowedOrigins:
          type: array
          items:
            type: string
          nullable: true
          description: Origins allowed to make requests, for example `https://example.com`. `*` allows any origin.
        exposeHeaders:
          type: array
          items:
            type: string
          nullable: true
          description: Response headers browsers may read, for example `ETag`.
        maxAgeSeconds:
          type: number
          nullable: true
          description: How long browsers may cache the preflight response, in seconds.
    CreateProjectResponse:
      type: object
      properties:
        _id:
          type: string
          description: ID of the new project.
        name:
          type: string
          description: Name of the new project.
        logId:
          description: ID of the first deployment. Use it to follow the build logs. `null` when `deploy` was `false`.
        action:
          type: string
          description: What happened, for example `create`.
        project:
          $ref: '#/components/schemas/IProject'
      required:
        - _id
        - name
        - logId
        - action
        - project
    CreateSandboxResponse:
      type: object
      properties:
        id:
          type: string
          description: ID of the sandbox.
        name:
          type: string
          description: Name of the sandbox.
        template:
          type: string
          description: Template (base image) the sandbox started from, for example `python-3.12`.
        size:
          type: string
          nullable: true
          description: Size preset, for example `sbx.micro`. Sets CPU, memory and disk.
        status:
          type: string
          description: Current state of the sandbox.
          enum:
            - starting
            - ready
            - failed
            - destroyed
            - pausing
            - paused
            - resuming
        created_at:
          type: string
          format: date-time
          description: When the sandbox was created (ISO 8601).
        expires_at:
          type: string
          format: date-time
          description: When the sandbox will be destroyed if it stays idle (ISO 8601).
      required:
        - id
        - name
        - template
        - size
        - status
        - created_at
        - expires_at
    DatabaseBackupHistoryItem:
      type: object
      properties:
        type:
          type: string
          description: Always `backup`.
          enum:
            - backup
        _id:
          $ref: '#/components/schemas/ObjectId'
        project_id:
          $ref: '#/components/schemas/ObjectId'
        user_id:
          $ref: '#/components/schemas/ObjectId'
        team:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: ID of the team that owns the database.
        status:
          type: string
          description: State of the backup.
          enum:
            - pending
            - running
            - completed
            - failed
            - deleted
        trigger:
          type: string
          description: "`scheduled` for automatic backups, `manual` for backups you started."
          enum:
            - manual
            - scheduled
        object_key:
          type: string
          nullable: true
          description: Storage key of the backup file.
        size_bytes:
          type: number
          nullable: true
          description: Size of the backup file, in bytes.
        failure_reason:
          type: string
          nullable: true
          description: Why the backup failed. `null` unless `status` is `failed`.
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: When the backup finished (ISO 8601).
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: When the backup file was deleted (ISO 8601).
        billed_through:
          type: string
          format: date-time
          nullable: true
          description: Backup storage has been billed up to this time (ISO 8601).
        pending_rebaseline_gb_hours:
          type: number
          description: Internal. Backup storage usage, in GB-hours, not yet billed.
        created_at:
          type: string
          format: date-time
          description: When the backup was requested (ISO 8601).
        updated_at:
          type: string
          format: date-time
          description: When the record last changed (ISO 8601).
      required:
        - type
        - _id
        - project_id
        - user_id
        - team
        - status
        - trigger
        - object_key
        - size_bytes
        - failure_reason
        - completed_at
        - deleted_at
        - billed_through
        - pending_rebaseline_gb_hours
        - created_at
        - updated_at
    DatabaseRestoreHistoryItem:
      type: object
      properties:
        type:
          type: string
          description: Always `restore`.
          enum:
            - restore
        _id:
          $ref: '#/components/schemas/ObjectId'
        project_id:
          $ref: '#/components/schemas/ObjectId'
        backup_history_id:
          $ref: '#/components/schemas/ObjectId'
        user_id:
          $ref: '#/components/schemas/ObjectId'
        team:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: ID of the team that owns the database.
        status:
          type: string
          description: State of the restore.
          enum:
            - pending
            - running
            - completed
            - failed
        object_key:
          type: string
          description: Storage key of the backup file being restored.
        engine:
          type: string
          nullable: true
          description: Database engine, for example `postgresql`.
        failure_reason:
          type: string
          nullable: true
          description: Why the restore failed. `null` unless `status` is `failed`.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When the restore started (ISO 8601).
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: When the restore finished (ISO 8601).
        created_at:
          type: string
          format: date-time
          description: When the restore was requested (ISO 8601).
        updated_at:
          type: string
          format: date-time
          description: When the record last changed (ISO 8601).
      required:
        - type
        - _id
        - project_id
        - backup_history_id
        - user_id
        - team
        - status
        - object_key
        - engine
        - failure_reason
        - started_at
        - completed_at
        - created_at
        - updated_at
    DatabaseUserResponse:
      type: object
      properties:
        id:
          type: string
          description: ID of the database user.
        projectId:
          type: string
          description: ID of the database project.
        username:
          type: string
          description: Login name of the user.
        permission:
          type: string
          description: "`readonly` can only read data; `readwrite` can read and change data."
          enum:
            - readonly
            - readwrite
        databases:
          type: array
          description: Databases the user can access.
          items:
            type: string
        status:
          type: string
          description: "`active` when the user exists in the database; `failed` when creating it failed."
          enum:
            - active
            - failed
        createdAt:
          type: string
          format: date-time
          description: When the user was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          description: When the user was last changed (ISO 8601).
      required:
        - id
        - projectId
        - username
        - permission
        - databases
        - status
        - createdAt
        - updatedAt
    DetectedFramework:
      type: object
      properties:
        dockerPort:
          type: number
          nullable: true
          description: Port the app listens on when deployed with Docker.
        name:
          type: string
          description: Framework name, for example `Next.js`.
        slug:
          type: string
          description: Framework identifier to send as `framework`, for example `nextjs`.
        demo:
          type: string
          nullable: true
          description: URL of a demo site built with the framework.
        logo:
          type: string
          description: URL of the framework logo.
        tagline:
          type: string
          nullable: true
          description: Short tagline for the framework.
        supported:
          type: boolean
          description: "`true` when Brimble can build and deploy this framework."
        description:
          type: string
          nullable: true
          description: Description of the framework.
        website:
          type: string
          description: Framework website.
        port:
          type: number
          description: Default port the app listens on.
        envPrefix:
          type: string
          nullable: true
          description: Prefix for variables exposed to browser code, for example `NEXT_PUBLIC_`.
        detector:
          type: string
          description: Dependency name that identifies the framework.
        file_detectors:
          type: array
          description: File names that identify the framework.
          items:
            type: string
        type:
          type: string
          description: "How the framework is served: `spa` and `static` are static files, `ssr` and `backend` run a server."
          enum:
            - spa
            - ssr
            - static
            - backend
        settings:
          type: object
          description: Default build settings for the framework.
          properties:
            installCommand:
              type: string
              nullable: true
              description: Default install command.
            startCommand:
              type: string
              nullable: true
              description: Default start command.
            buildCommand:
              type: string
              description: Default build command.
            outputDirectory:
              type: string
              description: Default output folder.
            manager:
              type: string
              nullable: true
              description: Package manager, for example `npm`, `yarn`, `pnpm` or `bun`.
          required:
            - buildCommand
            - outputDirectory
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: When the framework entry was added (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the framework entry was last changed (ISO 8601).
        _id:
          $ref: '#/components/schemas/ObjectId'
      required:
        - name
        - slug
        - logo
        - supported
        - website
        - port
        - detector
        - file_detectors
        - type
        - settings
        - _id
    DomainDnsSetupRecord:
      type: object
      properties:
        type:
          type: string
          description: Record type to create at your DNS provider.
          enum:
            - CNAME
        name:
          type: string
          description: Record name (host), relative to your zone. `@` is the zone apex.
        value:
          type: string
          description: Record value (target).
        isRecommended:
          type: boolean
          description: "`true` for the record we suggest you create."
      required:
        - type
        - name
        - value
        - isRecommended
    DomainEdgeInfo:
      type: object
      properties:
        target:
          type: string
          description: Hostname to point your CNAME record at.
        status:
          type: string
          nullable: true
          description: Certificate and hostname status at the edge, for example `active` or `pending`.
        ready:
          type: boolean
          description: "`true` when the edge certificate is issued and the domain can serve traffic."
        connected:
          type: boolean
          nullable: true
          description: "`true` when the domain's DNS already points at `target`."
      required:
        - target
        - ready
    DomainPurchasePendingResponse:
      type: object
      properties:
        pending:
          type: boolean
          description: "Always `true`: payment is needed before the domain is registered."
        status:
          type: string
          description: Payment status.
        reference:
          type: string
          description: Payment reference. The domain is registered once this payment completes.
        payment_link:
          type: string
          description: URL where the payment can be completed.
        payment_channel:
          type: string
          description: Payment provider used.
        reversed:
          type: boolean
          description: "`true` when the charge was refunded because registration failed."
      required:
        - pending
        - status
        - reference
        - payment_link
        - payment_channel
        - reversed
    DomainPurchaseSuccessResponse:
      type: object
      properties:
        pending:
          type: boolean
          nullable: true
          description: "Always `false`: the domain is registered."
        domainName:
          type: string
          description: Registered domain name.
        autoRenewEnabled:
          type: boolean
          description: "`true` when the domain renews automatically."
        nameservers:
          type: array
          description: Nameservers set on the domain.
          items:
            type: string
        renewalDate:
          type: string
          description: When the registration expires and renews (ISO 8601).
        renewalPrice:
          type: number
          description: Yearly renewal price, in USD.
        reversed:
          type: boolean
          description: "`true` when the charge was refunded because registration failed."
      required:
        - domainName
        - autoRenewEnabled
        - nameservers
        - renewalDate
        - renewalPrice
        - reversed
    DomainSettings:
      type: object
      properties:
        rootDomain:
          type: string
          description: Registrable domain, for example `example.com` for `app.example.com`.
        host:
          type: string
          description: Host part relative to the root domain, for example `app`. `@` for the root.
        isSubdomain:
          type: boolean
          description: "`true` when the domain is a subdomain."
        isCloudflareManaged:
          type: boolean
          description: "`true` when the root domain uses Cloudflare nameservers."
        records:
          type: array
          description: DNS records to create to connect the domain.
          items:
            $ref: '#/components/schemas/DomainDnsSetupRecord'
        nameservers:
          type: object
          description: Nameservers to use instead of creating records.
          properties:
            expected:
              type: array
              description: Brimble nameservers.
              items:
                type: string
            actual:
              type: array
              description: Nameservers the domain uses now.
              items:
                type: string
          required:
            - expected
            - actual
        detected:
          type: object
          description: What the domain resolves to now.
          properties:
            ip:
              type: string
              nullable: true
              description: IP address the domain resolves to.
            cname:
              type: array
              description: CNAME targets the domain resolves through.
              items:
                type: string
          required:
            - cname
      required:
        - rootDomain
        - host
        - isSubdomain
        - isCloudflareManaged
        - records
        - nameservers
        - detected
    EffectiveEnvironmentVariableWithSource:
      type: object
      properties:
        id:
          type: string
          description: ID of the variable.
        name:
          type: string
          description: Variable name.
        value:
          type: string
          description: Encrypted value. Use `POST /v1/decrypt` to read it.
        source:
          type: string
          description: "`own` when set on this environment; `inherited` when it comes from a parent environment."
          enum:
            - inherited
            - own
        sourceEnvironment:
          type: string
          nullable: true
          description: Name of the environment that defines the variable.
        user:
          type: string
          nullable: true
          description: Name of who last changed the variable.
        avatar:
          type: string
          nullable: true
          description: Avatar URL of who last changed the variable.
        createdAt:
          type: string
          nullable: true
          description: When the variable was created (ISO 8601).
        updatedAt:
          type: string
          nullable: true
          description: When the variable was last changed (ISO 8601).
        inheritable:
          type: boolean
          nullable: true
          description: "`true` when environments that inherit from this one receive the variable."
        sourceProject:
          type: string
          nullable: true
          description: ID of the project the variable is scoped to. `null` for variables shared with every project.
      required:
        - id
        - name
        - value
        - source
    EnvVariableResponse:
      type: object
      properties:
        id:
          type: string
          nullable: true
          description: ID of the secret.
        name:
          type: string
          description: Secret name.
        value:
          type: string
          description: Encrypted value. Use `POST /v1/decrypt` to read it.
        environment:
          type: string
          description: "`PRODUCTION` or `PREVIEW`."
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: When the secret was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the secret was last changed (ISO 8601).
        user:
          type: string
          description: Name of who last changed the secret.
        avatar:
          type: string
          description: Avatar URL of who last changed the secret.
        source:
          type: string
          enum:
            - preview
            - environment
            - production
          nullable: true
          description: "Where the value comes from: `production` or `preview` (set on the project), or `environment` (shared by the project's environment)."
        productionValue:
          type: string
          nullable: true
          description: "Preview listings only: encrypted production value of the same secret, for comparison."
        sharedSource:
          type: string
          enum:
            - inherited
            - own
          nullable: true
          description: "Environment variables only: `own` when set on this environment; `inherited` when it comes from a parent environment."
        sourceEnvironment:
          type: string
          nullable: true
          description: Environment variables only. Name of the environment that defines it.
        inheritable:
          type: boolean
          nullable: true
          description: "Environment variables only: `true` when environments that inherit from this one receive it."
        sourceProject:
