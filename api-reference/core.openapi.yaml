                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
                domainSuffix:
                  type: string
                  description: Suffix added to cloned `*.brimble.app` subdomains, for example `staging` turns `web.brimble.app` into `web-staging.brimble.app`. Letters, numbers and dashes, up to 32 characters. Defaults to the new environment's slug. Custom domains are not cloned.
