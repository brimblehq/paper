                      type: string
                      description: Prefix added to every log file key, for example `brimble/`.
                    accessKeyId:
                      type: string
                      description: Access key ID. Required unless `storageBucketId` is set.
                    secretAccessKey:
                      type: string
                      description: Secret access key. Required unless `storageBucketId` is set.
                    storageCredentialId:
                      type: string
                      nullable: true
