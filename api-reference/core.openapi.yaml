    post:
      tags:
        - Sandboxes
      summary: Create a sandbox
      operationId: createSandbox
      description: |-
        **API key scope:** `sandbox.create`

        **Team role permission:** `sandbox.create`
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Name of the sandbox, up to 64 characters. Omit to generate one.
                template:
                  type: string
                  description: Template (base image) to start from, for example `python-3.12`. Defaults to `python-3.12`.
                  minLength: 1
                  maxLength: 64
                teamId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
                environmentId:
                  type: string
                  description: Environment to create the sandbox in. Omit to use the default environment.
                  pattern: ^[a-fA-F0-9]{24}$
                region:
                  type: string
                  description: Region ID or slug, for example `eu-west`. Omit to use the default region.
                size:
                  type: string
                  description: Size preset, for example `sbx.micro`. Sets CPU, memory and disk. Omit to use your plan's default.
                autoDestroy:
                  type: boolean
                  description: Destroy the sandbox after `destroyTimeout` of inactivity.
                destroyTimeout:
                  enum:
                    - 30m
                    - 1h
                    - 3h
                    - 6h
                    - 12h
                    - 18h
                  type: string
                  description: "Idle time before the sandbox is destroyed: `30m`, `1h`, `3h`, `6h`, `12h` or `18h`. Required when `autoDestroy` is `true`."
                oneShot:
                  type: boolean
                  description: Destroy the sandbox as soon as it stops.
                blockOutbound:
                  type: boolean
                  description: Block all outbound network traffic. Cannot be combined with `egress`.
                egress:
                  type: object
                  description: Outbound network rules. Cannot be combined with `blockOutbound`.
                  properties:
                    mode:
                      enum:
                        - open
                        - restricted
                        - deny_all
                      type: string
                      description: "`open` allows all outbound traffic; `restricted` allows only `allow`; `deny_all` blocks everything."
                    allow:
                      type: array
                      description: "Destinations reachable when `mode` is `restricted`: IPv4 addresses, CIDR ranges or hostnames. Up to 50."
                      items:
                        type: string
                        minLength: 1
                persistent:
                  type: boolean
                  description: Give the sandbox a persistent disk that survives restarts. Requires `mountPath`.
                persistentDiskGB:
                  type: integer
                  description: Size of the persistent disk, in GB. Required when `persistent` is `true`.
                volumeId:
                  type: string
                  nullable: true
                  description: Attach an existing volume. Requires `mountPath`. Cannot be combined with `persistent`.
                mountPath:
                  type: string
                  nullable: true
                  description: Absolute path where the disk or volume is mounted, for example `/workspace`. Cannot be `/`.
                fromSnapshot:
                  type: string
                  description: ID of a snapshot to restore. The sandbox starts with the snapshot's files and template.
                  pattern: ^[a-fA-F0-9]{24}$
                snapshotMode:
                  enum:
                    - automatic
                    - manual
                  type: string
                  description: "`automatic` takes snapshots on `snapshotFrequency`; `manual` only when you ask."
                snapshotFrequency:
                  type: string
                  nullable: true
                  description: Cron expression for automatic snapshots, for example `0 * * * *`. Required when `snapshotMode` is `automatic`.
      responses:
        '201':
          description: Sandbox created
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Sandbox created
                  data:
                    $ref: '#/components/schemas/CreateSandboxResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
