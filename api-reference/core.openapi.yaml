  /v1/projects/database:
    post:
      tags:
        - Databases
      summary: Create a database
      operationId: createDatabase
      description: |-
        **API key scope:** `project.create`

        **Team role permission:** `project.create`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the database project.
                  minLength: 3
                  maxLength: 63
                dbImage:
                  type: string
                  description: ID of the database engine and version to deploy. See `GET /v1/projects/available-databases`.
                  pattern: ^[a-fA-F0-9]{24}$
                teamId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
                environmentId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Environment to create the database in. Omit to use the default environment.
                ha:
                  type: boolean
                  description: "Run as a high-availability cluster: one primary and two replicas in `secondaryRegions`. Defaults to `false`."
                secondaryRegions:
                  type: array
                  minItems: 2
                  maxItems: 2
                  description: IDs of the two regions that host the replicas. Required when `ha` is `true`.
                  items:
                    type: string
                    pattern: ^[a-fA-F0-9]{24}$
                tlsEnabled:
                  type: boolean
                  description: Require TLS for connections. Required for public access on some engines.
                pgbouncerEnabled:
                  type: boolean
                  description: "PostgreSQL only: put PgBouncer connection pooling in front of the database."
                pgbouncerConfig:
                  type: object
                  nullable: true
                  description: PgBouncer settings. Omit a field to keep its default.
                  properties:
                    defaultPoolSize:
                      type: integer
                      description: Server connections per user and database pair.
                      minimum: 1
                      maximum: 100
                    maxDbConnections:
                      type: integer
                      description: Maximum server connections per database. 0 means no limit.
                      minimum: 0
                      maximum: 500
                    maxDbClientConnections:
                      type: integer
                      description: Maximum client connections per database. 0 means no limit.
                      minimum: 0
                      maximum: 5000
                    maxUserConnections:
                      type: integer
                      description: Maximum server connections per user. 0 means no limit.
                      minimum: 0
                      maximum: 500
                    maxClientConn:
                      type: integer
                      description: Maximum client connections PgBouncer accepts in total.
                      minimum: 1
                      maximum: 10000
                    maxPreparedStatements:
                      type: integer
                      description: Prepared statements tracked per connection, for transaction pooling. 0 turns tracking off.
                      minimum: 0
                      maximum: 10000
                    serverLifetime:
                      type: integer
                      minimum: 60
                      maximum: 86400
                      description: Close server connections older than this, in seconds. 60 to 86400.
                    serverIdleTimeout:
                      type: integer
                      minimum: 10
                      maximum: 86400
                      description: Close server connections idle for longer than this, in seconds. 10 to 86400.
                  additionalProperties: false
                environments:
                  type: array
                  description: Extra environment variables passed to the database container.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Variable name.
                      value:
                        type: string
                        description: Variable value.
                    required:
                      - name
                      - value
                configurations:
                  description: Compute resources and region for the database.
                  allOf:
                    - $ref: '#/components/schemas/ComputeConfigurations'
                whitelistedIps:
                  type: array
                  description: IP addresses or CIDR ranges allowed to connect. Omit or leave empty to allow any address.
                  items:
                    type: string
                deploy:
                  type: boolean
                  description: Start the database right away. Defaults to `true`.
                volumeId:
                  type: string
                  description: ID of an existing volume to store the data on. Must be in the same region.
                  pattern: ^[a-fA-F0-9]{24}$
                linkedProjectIds:
                  type: array
                  description: IDs of projects that should receive this database's connection variables.
                  items:
                    type: string
                    pattern: ^[a-fA-F0-9]{24}$
                public:
                  type: boolean
                  nullable: true
                  description: Accept connections from the internet. When `false`, only services on Brimble's private network can connect. Defaults to `true`.
              required:
                - name
                - dbImage
                - environments
                - configurations
      responses:
        '200':
          description: Operation performed successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Operation performed successfully
                  data:
                    type: object
                    description: The result of the request.
                    properties:
                      id:
                        $ref: '#/components/schemas/ObjectId'
                      name:
                        type: string
                        description: Name of the new database project.
                      url:
                        type: string
                        description: Connection address of the database.
                    required:
                      - id
                      - name
                      - url
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
