                    type: string
                    maxLength: 1024
                    description: Header values must be at most 1KB
                sources:
                  type: array
                  minItems: 1
                  description: "Log types to send: `app` (your app's output), `system` (build and platform events) and `http` (request logs). Defaults to `app` and `system`."
                  items:
                    enum:
                      - app
                      - system
                      - http
                    type: string
                s3:
                  type: object
