        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Projects
      summary: Create a project
      operationId: createProject
      description: |-
        Creates a project from a git repository (`type: import`, the default), by cloning a template into a new repository (`type: clone`), or from a Docker image. The first deployment starts immediately unless `deploy` is `false`.

        **API key scope:** `project.create`

        **Team role permission:** `project.create`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  description: Project name. Required when importing a repository (`type` omitted or `import`).
                description:
                  type: string
                  description: Free-text description of the project.
                healthCheckPath:
                  type: string
                  description: Path Brimble requests to check the app is healthy, for example `/health`. Must start with `/`.
                buildHealthCheck:
                  type: boolean
                  description: Require a new deployment to pass health checks before it replaces the running one. Defaults to `true`.
                preStartCommand:
                  type: string
                  description: Command run in a separate container before each new deployment starts, for example `npm run migrate`.
                teamId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
                environmentId:
                  type: string
                  description: Environment to create the project in. Omit to use the default environment.
                  pattern: ^[a-fA-F0-9]{24}$
                git:
                  type: string
                  enum:
                    - GITHUB
                    - GITLAB
                    - BITBUCKET
                    - DOCKER
                    - HUGGINGFACE
                    - ORIGIN
                  description: Git provider, or `DOCKER` to deploy an image. Case-insensitive.
                repo:
                  allOf:
                    - $ref: '#/components/schemas/RepoType'
                  description: Required unless `template` is set.
                autoscalingGroup:
                  type: string
                  nullable: true
                  description: ID of an autoscaling group to apply. Send an empty string to remove it.
                buildCommand:
                  type: string
                  description: Command that builds the app, for example `npm run build`. Omit to use the framework default.
                outputDirectory:
                  type: string
                  description: Folder that contains the built files to serve, for example `dist`. Used by static sites.
                rootDirectory:
                  type: string
                  description: Folder in the repository that contains the app, for monorepos. Omit for the repository root.
                dockerfile:
                  type: string
                  description: Path to the Dockerfile, relative to `rootDirectory`. Only when `framework` is `docker`. Defaults to `Dockerfile`.
                watchPaths:
                  type: array
                  description: Glob patterns of files that trigger a deployment on push, for example `apps/web/**`. Omit to deploy on every change.
                  items:
                    type: string
                installCommand:
                  type: string
                  description: Command that installs dependencies, for example `npm ci`. Omit to use the framework default.
                runtimeVersions:
                  type: object
                  description: 'Runtime versions to build with, keyed by runtime, for example `{ "node": "20" }`. Supported keys: `node`, `python`, `go`, `php`, `java`, `ruby`, `dotnet`, `deno`, `rust`, `elixir`, `erlang`, `gleam`. Send `null` to use the defaults.'
                  properties:
                    node:
                      type: string
                      nullable: true
                      description: Node.js version, for example `20` or `20.11.1`.
                    python:
                      type: string
                      nullable: true
                      description: Python version, for example `3.12`.
                    go:
                      type: string
                      nullable: true
                      description: Go version, for example `1.22`.
                    php:
                      type: string
                      nullable: true
                      description: PHP version, for example `8.3`.
                    java:
                      type: string
                      nullable: true
                      description: Java version, for example `21`.
                    ruby:
                      type: string
                      nullable: true
                      description: Ruby version, for example `3.3`.
                    dotnet:
                      type: string
                      nullable: true
                      description: .NET version, for example `8.0`.
                    deno:
                      type: string
                      nullable: true
                      description: Deno version, for example `1.44`.
                    rust:
                      type: string
                      nullable: true
                      description: Rust version, for example `1.79`.
                    elixir:
                      type: string
                      nullable: true
                      description: Elixir version, for example `1.17`.
                    erlang:
                      type: string
                      nullable: true
                      description: Erlang/OTP version, for example `27`.
                    gleam:
                      type: string
                      nullable: true
                      description: Gleam version, for example `1.4`.
                isPrivate:
                  type: boolean
                  description: Whether the repository is private.
                serviceType:
                  enum:
                    - web-service
                    - static
                    - mcp
                    - worker
                  type: string
                  description: "What kind of service to run: `web-service` (an app that serves HTTP), `static` (static files), `mcp` (an MCP server) or `worker` (a background process with no public URL)."
                cronEnabled:
                  type: boolean
                  description: "Workers and web services: run the project on a cron schedule."
                cronExpression:
                  type: string
                  description: Cron schedule in 5-field or 6-field format, for example `*/15 * * * *`. Required when `cronEnabled` is `true`.
                cronTimezone:
                  type: string
                  description: IANA timezone for the schedule, for example `Europe/London`. Defaults to `UTC`.
                cronCommand:
                  type: string
                  description: "Web services only: command run on each cron tick. Required when `cronEnabled` is `true` for a web service."
                authEnabled:
                  type: boolean
                  description: "MCP servers only: require a valid Brimble API key on every request."
                  default: false
                public:
                  type: boolean
                  description: Accept traffic from the internet. When `false`, the project is reachable only from other services on Brimble's private network. Defaults to `true`.
                environments:
                  type: array
                  description: Secrets (environment variables) to set on the project.
                  items:
                    $ref: '#/components/schemas/SecretInput'
                installationId:
                  oneOf:
                    - type: string
                    - type: number
                  description: Git provider installation id. Required for GitHub when `git` is `GITHUB`.
                type:
                  enum:
                    - import
                    - clone
                  type: string
                  description: "`import` deploys an existing repository; `clone` creates a new repository from a template first. Defaults to `import`."
                clone:
                  type: object
                  description: Required when `type` is `clone`.
                  properties:
                    name:
                      type: string
                      description: Name of the new repository to create from the template.
                    private:
                      type: boolean
                      description: Create the new repository as private.
                  required:
                    - name
                    - private
                template:
                  type: string
                  description: ID of an MCP server template. Brimble fills in the repository and build settings, so `repo` is not needed.
                configurations:
                  description: Compute resources and region.
                  allOf:
                    - $ref: '#/components/schemas/ComputeConfigurations'
                registry_credentials:
                  type: object
                  description: Registry login, for private Docker images. Send both fields or neither.
                  properties:
                    username:
                      type: string
                      description: Registry username.
                    token:
                      type: string
                      description: Registry password or access token.
                diskSize:
                  type: integer
                  description: Create a new persistent volume of this size, in GB (10 to 150). Requires `mountPath`. Cannot be combined with `volumeId`.
                  minimum: 10
                  maximum: 150
                volumeId:
                  type: string
                  description: Attach an existing volume. Requires `mountPath`. Cannot be combined with `diskSize`.
                  pattern: ^[a-fA-F0-9]{24}$
                mountPath:
                  type: string
                  description: Absolute path where the volume is mounted, for example `/data`. Cannot be `/`.
                deploy:
                  type: boolean
                  description: Start the first deployment right away. Send `false` to only save the project. Defaults to `true`.
                  default: true
                startCommand:
                  type: string
                  nullable: true
                  description: Command that starts the app, for example `npm start`. Omit to use the framework default.
                framework:
                  type: string
                  nullable: true
                  description: Framework slug, for example `nextjs` or `docker`. See `GET /v1/frameworks`.
              required:
                - git
                - serviceType
      responses:
        '200':
          description: Projects created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Projects created successfully
                  data:
                    $ref: '#/components/schemas/CreateProjectResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
