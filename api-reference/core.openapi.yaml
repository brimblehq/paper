  /v1/projects/{projectId}/redeploy:
    post:
      tags:
        - Projects
      summary: Redeploy a project
      operationId: redeployProject
      description: |-
        Redeploys the project. With an empty body it rebuilds the latest commit. Send `logId` to redeploy the commit of an earlier deployment (rollback), or `startOnly: true` to restart without rebuilding. Including `name` together with build settings updates the project settings before redeploying.

        **API key scope:** `project.deploy`

        **Team role permission:** `project.deploy`
      parameters:
        - name: projectId
          in: path
          required: true
          description: ID of the project.
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                healthCheckPath:
                  type: string
                  description: Path Brimble requests to check the app is healthy, for example `/health`. Must start with `/`.
                authEnabled:
                  type: boolean
                  description: "MCP servers only: require a valid Brimble API key on every request."
                  default: false
                public:
                  type: boolean
                  description: Accept traffic from the internet. When `false`, the project is reachable only from other services on Brimble's private network. Defaults to `true`.
                deleteVolume:
                  type: boolean
                  description: Delete the attached volume and its data when the new settings remove it.
                http2:
                  type: boolean
                  description: Talk to your app over HTTP/2 (h2c) instead of HTTP/1.1. Your app must support h2c.
                buildHealthCheck:
                  type: boolean
                  description: Require a new deployment to pass health checks before it replaces the running one. Defaults to `true`.
                preStartCommand:
                  type: string
                  description: Command run in a separate container before each new deployment starts, for example `npm run migrate`.
                dockerfile:
                  type: string
                  description: Path to the Dockerfile, relative to `rootDirectory`. Only when `framework` is `docker`. Defaults to `Dockerfile`.
                runtimeVersions:
                  type: object
                  description: 'Runtime versions to build with, keyed by runtime, for example `{ "node": "20" }`. Supported keys: `node`, `python`, `go`, `php`, `java`, `ruby`, `dotnet`, `deno`, `rust`, `elixir`, `erlang`, `gleam`. Send `null` to use the defaults.'
                  properties:
                    node:
                      type: string
                      nullable: true
                      description: Node.js version, for example `20` or `20.11.1`.
                    python:
                      type: string
                      nullable: true
                      description: Python version, for example `3.12`.
                    go:
                      type: string
                      nullable: true
                      description: Go version, for example `1.22`.
                    php:
                      type: string
                      nullable: true
                      description: PHP version, for example `8.3`.
                    java:
                      type: string
                      nullable: true
                      description: Java version, for example `21`.
                    ruby:
                      type: string
                      nullable: true
                      description: Ruby version, for example `3.3`.
                    dotnet:
                      type: string
                      nullable: true
                      description: .NET version, for example `8.0`.
                    deno:
                      type: string
                      nullable: true
                      description: Deno version, for example `1.44`.
                    rust:
                      type: string
                      nullable: true
                      description: Rust version, for example `1.79`.
                    elixir:
                      type: string
                      nullable: true
                      description: Elixir version, for example `1.17`.
                    erlang:
                      type: string
                      nullable: true
                      description: Erlang/OTP version, for example `27`.
                    gleam:
                      type: string
                      nullable: true
                      description: Gleam version, for example `1.4`.
                watchPaths:
                  type: array
                  description: Glob patterns of files that trigger a deployment on push, for example `apps/web/**`. Omit to deploy on every change.
                  items:
                    type: string
                configurations:
                  type: object
                  description: Compute resources and region.
                  properties:
                    cpu:
                      type: number
                      description: CPU, in vCPUs. Up to 8.
                    memory:
                      type: number
                      description: Memory, in GB. Up to 16.
                    storage:
                      type: number
                      description: Disk, in GB. 0.5 to 150.
                    region:
                      type: string
                      nullable: true
                      description: ID of the region to run in. See `GET /v1/regions`.
                  required:
                    - cpu
                    - memory
                    - storage
                diskSize:
                  type: integer
                  description: Create a new persistent volume of this size, in GB (10 to 150). Requires `mountPath`. Cannot be combined with `volumeId`.
                  minimum: 10
                  maximum: 150
                volumeId:
                  type: string
                  description: Attach an existing volume. Requires `mountPath`. Cannot be combined with `diskSize`.
                  pattern: ^[a-fA-F0-9]{24}$
                mountPath:
                  type: string
                  description: Absolute path where the volume is mounted, for example `/data`. Cannot be `/`.
                autoscalingGroup:
                  type: string
                  nullable: true
                  description: ID of an autoscaling group to apply. Send an empty string to remove it.
                serviceType:
                  type: string
                  description: "What kind of service to run: `web-service` (an app that serves HTTP), `static` (static files), `mcp` (an MCP server) or `worker` (a background process with no public URL)."
                  enum:
                    - web-service
                    - static
                    - mcp
                    - worker
                cronEnabled:
                  type: boolean
                  description: "Workers and web services: run the project on a cron schedule."
                cronExpression:
                  type: string
                  description: Cron schedule in 5-field or 6-field format, for example `*/15 * * * *`. Required when `cronEnabled` is `true`.
                cronTimezone:
                  type: string
                  description: IANA timezone for the schedule, for example `Europe/London`. Defaults to `UTC`.
                cronCommand:
                  type: string
                  description: "Web services only: command run on each cron tick. Required when `cronEnabled` is `true` for a web service."
                sendReport:
                  type: boolean
                  description: Email a deployment report when the deployment finishes.
                logId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Redeploy the commit from this earlier deployment.
                buildCacheEnabled:
                  type: boolean
                  nullable: true
                  description: Cache dependencies between builds to speed them up.
                installCommand:
                  type: string
                  nullable: true
                  description: Command that installs dependencies, for example `npm ci`. Omit to use the framework default.
                buildCommand:
                  type: string
                  nullable: true
                  description: Command that builds the app, for example `npm run build`. Omit to use the framework default.
                startCommand:
                  type: string
                  nullable: true
                  description: Command that starts the app, for example `npm start`. Omit to use the framework default.
                outputDirectory:
                  type: string
                  nullable: true
                  description: Folder that contains the built files to serve, for example `dist`. Used by static sites.
                rootDirectory:
                  type: string
                  nullable: true
                  description: Folder in the repository that contains the app, for monorepos. Omit for the repository root.
                framework:
                  type: string
                  nullable: true
                  description: Framework slug, for example `nextjs` or `docker`. See `GET /v1/frameworks`.
                repo:
                  allOf:
                    - $ref: '#/components/schemas/RepoType'
                  nullable: true
                  description: Repository or image to deploy from.
                name:
                  type: string
                  description: Project name. When present, the other settings in the body are saved to the project before redeploying.
                specs:
                  allOf:
                    - $ref: '#/components/schemas/ComputeConfigurations'
                  nullable: true
                  description: Compute resources. Same shape as `configurations`.
                startOnly:
                  type: boolean
                  description: Restart the current build without rebuilding.
      responses:
        '200':
          description: Operation success
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Operation success
                  data:
                    description: The result of the request.
                    oneOf:
                      - type: object
                        properties:
                          id:
                            description: ID of the project.
                          logId:
                            description: ID of the new deployment. Use it to follow the build logs.
                        required:
                          - id
                          - logId
                      - type: object
                        properties:
                          id:
                            description: ID of the project.
                          name:
                            type: string
                            description: Name of the project.
                          logId:
                            nullable: true
                            description: ID of the new deployment. Use it to follow the build logs.
                          status:
                            nullable: true
                            description: Status of the new deployment.
                        required:
                          - id
                          - name
                      - type: object
                        properties:
                          id:
                            $ref: '#/components/schemas/ObjectId'
                          sendReport:
                            type: boolean
                            description: "`true` when a deployment report email will be sent."
                        required:
                          - id
                          - sendReport
                      - type: object
                        properties:
                          id:
                            $ref: '#/components/schemas/ObjectId'
                          sendReport:
                            nullable: true
                            description: "`true` when a deployment report email will be sent."
                        required:
                          - id
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
