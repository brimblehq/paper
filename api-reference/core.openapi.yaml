  /v1/storage/buckets:
    post:
      tags:
        - Object Storage
      summary: Create a bucket
      operationId: createBucket
      description: |-
        Creates a bucket. Choose where its data lives with `region`. The region is permanent: to move a bucket later, create a new one and copy the objects.

        Available regions:

        | ID | Location |
        |---|---|
        | `global` | Global: data is distributed and follows access patterns (default) |
        | `sjc` | San Jose, California, USA |
        | `ord` | Chicago, Illinois, USA |
        | `iad` | Ashburn, Virginia, USA |
        | `ams` | Amsterdam, Netherlands |
        | `fra` | Frankfurt, Germany |
        | `lhr` | London, United Kingdom |
        | `sin` | Singapore |
        | `nrt` | Tokyo, Japan |
        | `los` | Lagos, Nigeria |

        The list can grow. Call [`GET /v1/storage/regions`](/api-reference/object-storage/list-storage-regions) for the current list.

        **API key scope:** `storage.create`

        **Team role permission:** `storage.create`
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  description: Bucket name, at least 3 characters.
                projectId:
                  type: string
                  description: Project to associate the bucket with.
                  pattern: ^[a-fA-F0-9]{24}$
                environmentId:
                  type: string
                  description: Environment to create the bucket in. Omit to use the default environment.
                  pattern: ^[a-fA-F0-9]{24}$
                region:
                  type: string
                  description: ID of the region to store the data in. See the table above or `GET /v1/storage/regions`. Defaults to `global`. Cannot be changed after the bucket is created.
                  enum:
                    - global
                    - sjc
                    - ord
                    - iad
                    - ams
                    - fra
                    - lhr
                    - sin
                    - nrt
                    - los
                  example: fra
                isPublic:
                  type: boolean
                  nullable: true
                  description: Make objects readable by anyone with the URL. Defaults to `false`.
                corsRules:
                  type: array
                  items:
                    $ref: '#/components/schemas/CorsRule'
                  nullable: true
                  description: CORS rules for browser access.
                lifecycleRules:
                  type: array
                  items:
                    $ref: '#/components/schemas/LifecycleRule'
                  nullable: true
                  description: Rules that delete or move objects after a number of days.
                browserUploadOrigins:
                  type: array
                  items:
                    type: string
                  nullable: true
                  description: Not supported. Leave empty.
                teamId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
              required:
                - name
      responses:
        '201':
          description: Storage bucket created
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Storage bucket created
                  data:
                    type: object
                    description: The result of the request.
                    properties:
                      _id:
                        $ref: '#/components/schemas/ObjectId'
                      name:
                        type: string
                        description: Name of the bucket.
                      project:
                        allOf:
                          - $ref: '#/components/schemas/ObjectId'
                        nullable: true
                        description: Project the bucket is associated with.
                      project_environment:
                        oneOf:
                          - $ref: '#/components/schemas/ObjectId'
                          - $ref: '#/components/schemas/IProjectEnvironment'
                        nullable: true
                        description: Environment the bucket belongs to.
                      user_id:
                        allOf:
                          - $ref: '#/components/schemas/ObjectId'
                        nullable: true
                        description: User who created the bucket.
                      team:
                        allOf:
                          - $ref: '#/components/schemas/ObjectId'
                        nullable: true
                        description: Team that owns the bucket.
                      bucket_name:
                        type: string
                        description: Bucket name at the storage provider. Use it with S3 clients.
                      provider:
                        type: string
                        description: Storage provider.
                      is_public:
                        type: boolean
                        description: "`true` when objects are readable by anyone with the URL."
                      versioning:
                        type: boolean
                        description: "`true` when object versioning is on."
                      region:
                        type: string
                        description: Region where the data is stored.
                      storage_used:
                        type: number
                        description: Total size of the objects, in bytes.
                      storage_increased_by:
                        type: number
                        description: Bytes added since the previous usage check.
                      storage_decreased_by:
                        type: number
                        description: Bytes removed since the previous usage check.
                      reserved_bytes:
                        type: number
                        description: Bytes reserved by uploads that have started but not finished.
                      cors_rules:
                        type: array
                        description: CORS rules for browser access.
                        items:
                          type: object
                          properties:
                            allowedOrigins:
                              type: array
                              description: Origins allowed to make requests.
                              items:
                                type: string
                            allowedHeaders:
                              type: array
                              items:
                                type: string
                              nullable: true
                              description: Request headers browsers may send.
                            allowedMethods:
                              type: array
                              items:
                                type: string
                              nullable: true
                              description: HTTP methods browsers may use.
                            exposeHeaders:
                              type: array
                              items:
                                type: string
                              nullable: true
                              description: Response headers browsers may read.
                            maxAgeSeconds:
                              type: number
                              nullable: true
                              description: How long browsers may cache the preflight response, in seconds.
                          required:
                            - allowedOrigins
                      lifecycle_rules:
                        type: array
                        items:
                          $ref: '#/components/schemas/StorageLifecycleRule'
                        nullable: true
                        description: Rules that delete or move objects after a number of days.
                      status:
                        type: string
                        description: "`active`, or `deleting` while the bucket is being removed."
                        enum:
                          - active
                          - deleting
                          - deleted
                      starred:
                        type: boolean
                        description: "`true` when the bucket is starred in the dashboard."
                      createdAt:
                        type: string
                        format: date-time
                        description: When the bucket was created (ISO 8601).
                      updatedAt:
                        type: string
                        format: date-time
                        description: When the bucket was last changed (ISO 8601).
                      url:
                        type: string
                        description: Path-style URL of the bucket at the storage provider.
                      capabilities:
                        $ref: '#/components/schemas/StorageBucketCapabilities'
                    required:
                      - _id
                      - name
                      - project
                      - project_environment
                      - user_id
                      - team
                      - bucket_name
                      - provider
                      - is_public
                      - versioning
                      - region
                      - storage_used
                      - storage_increased_by
                      - storage_decreased_by
                      - reserved_bytes
                      - cors_rules
                      - lifecycle_rules
                      - status
                      - starred
                      - createdAt
                      - updatedAt
                      - url
                      - capabilities
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
