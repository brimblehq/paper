components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-brimble-key
      description: API key created in the dashboard under Settings → API keys. Each key carries permission scopes; every endpoint lists the scope it needs.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Dashboard session token. Use an API key for integrations.
  schemas:
    CloneEnvironmentInclude:
      type: object
      properties:
        variables:
          type: boolean
        projects:
          type: boolean
        sandboxes:
          type: boolean
        buckets:
          type: boolean
      required:
        - variables
        - projects
        - sandboxes
        - buckets
    ComputeConfigurations:
      type: object
      properties:
        cpu:
          type: number
        memory:
          type: number
        storage:
          type: number
        region:
          type: string
          nullable: true
      required:
        - cpu
        - memory
        - storage
    ConfigManagedFields:
      type: object
      properties:
        path:
          type: string
        fields:
          type: array
          items:
            type: string
        commit:
          type: string
        applied_at:
          type: string
          format: date-time
      required:
        - path
        - fields
        - commit
        - applied_at
    ConsulHealthStatus:
      type: object
      properties:
        status:
          type: string
        statusCode:
          type: number
          nullable: true
      required:
        - status
    CorsRule:
      type: object
      properties:
        allowedHeaders:
          type: array
          items:
            type: string
          nullable: true
        allowedMethods:
          type: array
          items:
            type: string
          nullable: true
        allowedOrigins:
          type: array
          items:
            type: string
          nullable: true
        exposeHeaders:
          type: array
          items:
            type: string
          nullable: true
        maxAgeSeconds:
          type: number
          nullable: true
    CreateProjectResponse:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        logId: {}
        action:
          type: string
        project:
          $ref: '#/components/schemas/IProject'
      required:
        - _id
        - name
        - logId
        - action
        - project
    CreateSandboxResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        template:
          type: string
        size:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - starting
            - ready
            - failed
            - destroyed
            - pausing
            - paused
            - resuming
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - template
        - size
        - status
        - created_at
