openapi: 3.0.3
info:
  title: Brimble API
  version: 1.0.0
  description: |
    The Brimble API lets you deploy and manage projects, databases, domains, sandboxes, object storage and more.

    ## Base URL

    All endpoints are relative to `https://api.brimble.io/core`, for example `GET https://api.brimble.io/core/v1/projects`.

    ## Authentication

    Create an API key in the dashboard under **Settings → API keys** and send it in the `x-brimble-key` header:

    ```
    x-brimble-key: <your API key>
    ```

    Each API key carries permission scopes such as `project.read` or `project.deploy`. Every endpoint lists the scope it needs; a key without that scope gets `403`. Dashboard session tokens (`Authorization: Bearer <token>`) are also accepted, but integrations should use API keys.

    ## Teams

    Endpoints act on your personal workspace unless you pass a team. Most endpoints accept `teamId` (as a query parameter, or in the body for writes). API keys created for a team act in that team. Inside a team, your team role must also allow the action; each endpoint lists the team permission it checks.

    ## Responses

    Successful responses are JSON with this shape:

    ```json
    { "message": "Projects fetched", "data": { } }
    ```

    Errors return a `message`:

    ```json
    { "message": "Project not found", "data": {} }
    ```

    Requests that fail validation return `400` with every invalid field:

    ```json
    { "errors": [{ "type": "field", "msg": "Project name should be provided", "path": "name", "location": "body" }] }
    ```

    ## Rate limits

    Requests made with an API key are rate limited. Responses include `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset` and `X-RateLimit-Bucket`. Command execution and file transfer endpoints use separate buckets.

    ## Idempotency

    Endpoints that accept an `Idempotency-Key` header return the original result when retried with the same key and body, instead of repeating the operation.

    ## Streaming

    Command execution endpoints can stream output as Server-Sent Events (`text/event-stream`). Each event is `data: <json>` where the JSON has a `type` of `stdout`, `stderr`, `done` or `error`.

    ## Webhooks

    To receive events instead of polling, configure a webhook with `PATCH /v1/webhooks`. See the [Webhooks guide](/webhooks/overview) and the [Webhook events reference](/webhooks/events) for every payload.
  contact:
    name: Brimble
    url: https://brimble.io
servers:
  - url: https://api.brimble.io/core
    description: Production
security:
  - ApiKeyAuth: []
  - BearerAuth: []
tags:
  - name: Projects
    description: Create, deploy, configure and manage projects.
  - name: Deployments and Logs
    description: Deployment history, build logs and request logs.
  - name: Environments
    description: Project environments (production, staging, previews) and their variables.
  - name: Secrets
    description: Secrets (environment variables) set on a single project. Not to be confused with Environments, which group projects into production, staging and preview.
  - name: Webhooks
    description: |-
      Receive events from Brimble at your own endpoint (or a Discord or Slack channel). Configure the destination and events with `PATCH /v1/webhooks`; use `*` to receive every event.

      See the [Webhooks guide](/webhooks/overview) for setup, and the [Webhook events reference](/webhooks/events) for the payload each event delivers.

      | Event | Sent when |
      | --- | --- |
      | `project.created` | A project is created |
      | `project.updated` | A project is updated |
      | `project.deleted` | A project is deleted |
      | `project.domain.updated` | A project domain changes |
      | `deployment.created` | A deployment is queued |
      | `deployment.started` | A deployment starts |
      | `deployment.success` | A deployment succeeds |
      | `deployment.failed` | A deployment fails |
      | `environment.variables.added` | Environment variables are added |
      | `environment.variables.updated` | Environment variables are updated |
      | `environment.variables.deleted` | Environment variables are deleted |
      | `domain.created` | A domain is added |
      | `domain.purchased` | A domain is purchased |
      | `domain.renewed` | A domain is renewed |
      | `domain.expired` | A domain expires |
      | `dns.record.created` | A DNS record is created |
      | `dns.record.updated` | A DNS record is updated |
      | `dns.record.deleted` | A DNS record is deleted |
      | `database.created` | A database is created |
      | `database.backup.completed` | A database backup completes |
      | `autoscaling.group.created` | An autoscaling rule is created |
      | `autoscaling.group.updated` | An autoscaling rule is updated |
      | `autoscaling.group.deleted` | An autoscaling rule is deleted |
      | `payment.successful` | A payment succeeds |
      | `payment.failed` | A payment fails |

      Test deliveries sent with `POST /v1/webhooks/test` include the header `X-Brimble-Test: true`.
  - name: Git Providers
    description: Connected git accounts, repositories and linking repositories to projects.
  - name: Domains
    description: Custom domains, DNS records and domain registration.
  - name: Databases
    description: 'Managed databases: provisioning, backups, users and linking to projects.'
  - name: Log Drains
    description: Stream logs to external destinations.
  - name: Sandboxes
    description: Isolated sandboxes for running code, with files and snapshots.
  - name: Object Storage
    description: S3-compatible buckets, objects and credentials.
  - name: Scaling and Networking
    description: Autoscaling rules, networking and CDN cache, and rate limits.
  - name: Teams
    description: Teams, members, invitations and roles.
  - name: Catalog
    description: Regions, frameworks and plans. No authentication required.
paths:
  /v1/accounts/{git}:
    get:
      tags:
        - Git Providers
      summary: List connected git provider accounts
      operationId: listConnectedGitProviderAccounts
      description: '**API key scope:** `user.read`'
      parameters:
        - name: git
          in: path
          required: true
          schema:
            type: string
            enum:
              - GITHUB
              - GITLAB
              - BITBUCKET
              - DOCKER
              - HUGGINGFACE
              - ORIGIN
          description: Git provider. Case-insensitive.
        - name: installationId
          in: query
          required: false
          schema:
            type: number
        - name: repoName
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Provider accounts found
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Provider accounts found
                  data:
                    type: object
                    properties:
                      accounts:
                        type: array
                        items:
                          $ref: '#/components/schemas/GitAccount'
                      authenticated:
                        type: boolean
                    required:
                      - accounts
                      - authenticated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/autoscaling:
    post:
      tags:
        - Scaling and Networking
      summary: Create an autoscaling rule
      operationId: createAutoscalingRule
      description: |-
        **API key scope:** `autoscaling.create`

        **Team role permission:** `autoscaling.create`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                active:
                  type: boolean
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 8
                  description: Replicas must be at least 1 and less than 8. Required when `active` is `false`.
                min_containers:
                  type: integer
                  minimum: 1
                  description: Required when `active` is `true`.
                team_id:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
                max_containers:
                  type: integer
                  minimum: 1
                  description: Required when `active` is `true`.
                meta:
                  type: object
                max_memory:
                  type: integer
                  minimum: 30
                  description: Required when `active` is `true`.
                max_cpu:
                  type: integer
                  minimum: 30
                  description: Required when `active` is `true`.
              required:
                - name
                - active
      responses:
        '201':
          description: Autoscaling group created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Autoscaling group created successfully
                  data:
                    $ref: '#/components/schemas/IAutoScalingGroup'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags:
        - Scaling and Networking
      summary: List autoscaling rules
      operationId: listAutoscalingRules
      description: |-
        **API key scope:** `autoscaling.read`

        **Team role permission:** `autoscaling.read`
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Autoscaling groups fetched successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Autoscaling groups fetched successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IAutoScalingGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/autoscaling/{id}:
    put:
      tags:
        - Scaling and Networking
      summary: Update an autoscaling rule
      operationId: updateAutoscalingRule
      description: |-
        **API key scope:** `autoscaling.update`

        **Team role permission:** `autoscaling.update`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                active:
                  type: boolean
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 8
                  description: Replicas must be at least 1 and less than 8. Required when `active` is `false`.
                min_containers:
                  type: integer
                  minimum: 1
                  description: Required when `active` is `true`.
                team_id:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
                max_containers:
                  type: integer
                  minimum: 1
                  description: Required when `active` is `true`.
                meta:
                  type: object
                max_memory:
                  type: integer
                  minimum: 30
                  description: Required when `active` is `true`.
                max_cpu:
                  type: integer
                  minimum: 30
                  description: Required when `active` is `true`.
              required:
                - name
                - active
      responses:
        '200':
          description: Group updated, redeploy your project to apply changes
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Group updated, redeploy your project to apply changes
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/decrypt:
    post:
      tags:
        - Secrets
      summary: Decrypt secrets
      operationId: decryptSecrets
      description: |-
        Secret values returned by the list endpoints are encrypted. Send them here to get the plain values back. Each item is returned with its `value` decrypted.

        **API key scope:** `env.read`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                environments:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                      - value
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                        description: Encrypted value, exactly as returned by the API.
              required:
                - environments
      responses:
        '200':
          description: Envs decrypted successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Envs decrypted successfully
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                          description: Plain value.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/domains:
    get:
      tags:
        - Domains
      summary: List domains
      operationId: listDomains
      description: '**API key scope:** `domain.read`'
      parameters:
        - name: environmentId
          in: query
          required: false
          schema:
            type: string
        - name: x-brimble-environment
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Domains fetched successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Domains fetched successfully
                  data:
                    type: object
                    properties:
                      domains:
                        type: array
                        items: {}
                      totalPages:
                        type: number
                      currentPage:
                        type: number
                      filterBy:
                        type: string
                    required:
                      - domains
                      - totalPages
                      - currentPage
                      - filterBy
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Domains
      summary: Add a domain
      operationId: addDomain
      description: |-
        Adds a custom domain. Pass the project in the path to attach it to that project; without it the domain is added to the workspace only.

        **API key scope:** `domain.create`

        **Team role permission:** `domain.create`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 63
                teamId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
                redirect:
                  type: object
                  properties:
                    url:
                      type: string
                    status:
                      type: number
                      enum:
                        - 301
                        - 302
                        - 307
                        - 308
                      nullable: true
                  required:
                    - url
                  nullable: true
              required:
                - name
      responses:
        '201':
          description: Domain created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Domain created successfully
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/IDomain'
                      - type: array
                        items:
                          $ref: '#/components/schemas/IDomain'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/domains/sale/purchase:
    post:
      tags:
        - Domains
      summary: Purchase a domain
      operationId: purchaseDomain
      description: |-
        **API key scope:** `domain.create`

        **Team role permission:** `domain.create`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 63
                duration:
                  type: integer
                  minimum: 1
                  maximum: 10
                projectId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                teamId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
                privacyEnabled:
                  type: boolean
                autoRenewal:
                  type: boolean
                couponCode:
                  type: string
                  minLength: 1
                  maxLength: 40
                paymentProvider:
                  type: string
                  enum:
                    - stripe
                    - blockradar
              required:
                - name
                - duration
                - privacyEnabled
                - autoRenewal
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/DomainPurchasePendingResponse'
                      - $ref: '#/components/schemas/DomainPurchaseSuccessResponse'
                    nullable: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/domains/sale/search:
    post:
      tags:
        - Domains
      summary: Search domains for sale
      operationId: searchDomainsForSale
      description: '**API key scope:** `domain.read`'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Available domain(s)
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Available domain(s)
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        purchasePrice: {}
                        domainName: {}
                        sld: {}
                        tld: {}
                        purchasable: {}
                        purchaseType: {}
                        previousPrice: {}
                        renewalPrice: {}
                        isDiscounted: {}
                        privacySupported: {}
                        minRegistrationYears: {}
                      required:
                        - purchasePrice
                        - domainName
                        - sld
                        - tld
                        - purchasable
                        - purchaseType
                        - previousPrice
                        - renewalPrice
                        - isDiscounted
                        - privacySupported
                        - minRegistrationYears
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/domains/{domainId}:
    delete:
      tags:
        - Domains
      summary: Delete a domain
      operationId: deleteDomain
      description: |-
        **API key scope:** `domain.delete`

        **Team role permission:** `domain.delete`
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Domain deleted successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Domain deleted successfully
                  data:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Domains
      summary: Update a domain
      operationId: updateDomain
      description: |-
        **API key scope:** `domain.update`

        **Team role permission:** `domain.update`
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 63
                teamId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
                redirect:
                  type: object
                  properties:
                    url:
                      type: string
                    status:
                      type: number
                      enum:
                        - 301
                        - 302
                        - 307
                        - 308
                      nullable: true
                  required:
                    - url
                  nullable: true
              required:
                - name
      responses:
        '200':
          description: Domain updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Domain updated successfully
                  data:
                    type: object
                    properties:
                      name: {}
                      id: {}
                      primary: {}
                      project: {}
                      preview: {}
                      user_id: {}
                      team_id: {}
                      isCustom:
                        type: boolean
                      records: {}
                      nameserver: {}
                      nameservers: {}
                      redirect: {}
                      active:
                        type: boolean
                        nullable: true
                      enabled: {}
                      purchased: {}
                      wildcard_enabled:
                        type: boolean
                      wildcard_verified:
                        type: boolean
                      edge: {}
                      createdAt: {}
                      updatedAt: {}
                      isExpired:
                        type: boolean
                    required:
                      - name
                      - id
                      - primary
                      - project
                      - preview
                      - user_id
                      - team_id
                      - isCustom
                      - records
                      - nameserver
                      - nameservers
                      - redirect
                      - active
                      - enabled
                      - purchased
                      - wildcard_enabled
                      - wildcard_verified
                      - edge
                      - createdAt
                      - updatedAt
                      - isExpired
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/domains/{domainId}/wildcard:
    patch:
      tags:
        - Domains
      summary: Enable or disable a wildcard domain
      operationId: enableOrDisableWildcardDomain
      description: |-
        Turns `*.yourdomain.com` on or off for a custom domain. The domain must be an apex domain (not a Brimble subdomain), attached to a project, on a plan that includes wildcard domains. For domains whose DNS Brimble manages, the wildcard is verified straight away; otherwise add the wildcard DNS record and check `wildcard_verified` on the domain.

        **API key scope:** `domain.update`

        **Team role permission:** `domain.update`
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Turn the wildcard on or off.
                teamId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
              required:
                - enabled
      responses:
        '200':
          description: Domain wildcard updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Domain wildcard updated successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      wildcard_enabled:
                        type: boolean
                      wildcard_verified:
                        type: boolean
                    required:
                      - id
                      - name
                      - wildcard_enabled
                      - wildcard_verified
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/domains/{domainId}/{projectId}:
    delete:
      tags:
        - Domains
      summary: Delete a domain
      operationId: deleteDomainForProjectId
      description: |-
        **API key scope:** `domain.delete`

        **Team role permission:** `domain.delete`
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Domain deleted successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
