      summary: List request logs
      operationId: listRequestLogs
      description: |-
        **API key scope:** `log.read`

        **Team role permission:** `log.read`
      parameters:
        - name: projectId
          in: path
          required: true
          description: ID of the project.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Logs per page. 1 to 200. Defaults to 15.
          schema:
            type: number
            nullable: true
        - name: page
          in: query
          required: false
          description: Page number to report back in `currentPage`. Use `cursor` to move between pages.
          schema:
            type: number
            nullable: true
        - name: sort
          in: query
          required: false
          description: Sort logs on the page by `timestamp` (default), `status`, `method` or `url`.
          schema:
            type: string
            nullable: true
        - name: methods
          in: query
          required: false
          description: Comma-separated HTTP methods to include, for example `GET,POST`.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
            nullable: true
        - name: cursor
          in: query
          required: false
          description: "`nextCursor` from the previous page. Overrides `end`."
          schema:
            oneOf:
              - type: string
              - type: number
            nullable: true
        - name: start
          in: query
          required: false
          description: "Start of the time range: ISO 8601 or Unix milliseconds. Defaults to 24 hours before `end`."
          schema:
            oneOf:
              - type: string
              - type: number
            nullable: true
        - name: end
          in: query
          required: false
          description: "End of the time range: ISO 8601 or Unix milliseconds. Defaults to now."
          schema:
            oneOf:
              - type: string
              - type: number
            nullable: true
        - name: direction
          in: query
          required: false
          description: "`backward` returns newest first (default); `forward` returns oldest first."
          schema:
            type: string
            enum:
              - BACKWARD
              - FORWARD
              - backward
              - forward
            nullable: true
        - name: statuses
          in: query
          required: false
          description: Comma-separated HTTP status codes to include, for example `500,502`.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
            nullable: true
        - name: level
          in: query
          required: false
          description: Only return logs at this level, for example `error`.
          schema:
            type: string
            nullable: true
        - name: search
          in: query
          required: false
          description: Only return logs that contain this text (case-insensitive).
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: Request logs fetched successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
