    patch:
      tags:
        - Scaling and Networking
      summary: Update rate limit settings
      operationId: updateRateLimitSettings
      description: |-
        **API key scope:** `ratelimit.update`

        **Team role permission:** `ratelimit.update`
      parameters:
        - name: projectId
          in: path
          required: true
          description: ID of the project.
          schema:
            type: string
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Turn rate limiting on or off.
                zones:
                  type: array
                  description: Rate limit rules. Replaces the existing rules.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Name of the zone.
                      key:
                        type: string
                        description: What requests are counted by. `ip.src` counts per client IP; a placeholder such as `{http.request.header.X-API-Key}` counts per header value.
                      window:
                        type: string
                        description: Length of the counting window, for example `10s`, `1m` or `1h`. Unsupported windows return `400`.
                      events:
                        type: integer
                        description: Requests allowed per `key` in each `window`. Further requests get `429`.
                        minimum: 1
                      matcher:
                        type: object
                        description: Limit the zone to some methods or paths. Omit to apply it to every request.
                        properties:
                          methods:
                            type: array
                            description: HTTP methods, for example `POST`.
                            items:
                              type: string
                          paths:
                            type: array
                            description: Paths, for example `/api/*`.
                            items:
                              type: string
                      ipv4Prefix:
                        type: integer
                        description: When `key` is `ip.src`, group IPv4 clients by this prefix length, for example `24`.
                        minimum: 0
                        maximum: 32
                      ipv6Prefix:
                        type: integer
                        description: When `key` is `ip.src`, group IPv6 clients by this prefix length, for example `64`.
                        minimum: 0
                        maximum: 128
                    required:
                      - name
                      - key
                      - window
                      - events
                teamId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
