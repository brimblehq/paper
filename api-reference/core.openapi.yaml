      parameters:
        - name: projectId
          in: path
          required: true
          description: ID of the database project.
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New name for the database project.
                  minLength: 3
                  maxLength: 63
                password:
                  type: string
                  description: New password for the main database user.
                configurations:
                  type: object
                  description: New compute resources. Changing them restarts the database.
                  properties:
                    cpu:
                      type: number
                      description: CPU, in vCPUs. Up to 8.
                      maximum: 8
                    memory:
                      type: number
                      description: Memory, in GB. Up to 16.
                      maximum: 16
                    storage:
                      type: number
                      minimum: 0.5
                      maximum: 50
                      description: Storage allocation, in GB. 0.5 to 50.
                    diskSize:
                      type: number
                      minimum: 1
                      maximum: 150
                      description: Size of the data volume, in GB. 1 to 150. Volumes can grow but not shrink.
                    volumeMount:
                      type: string
                      description: Path where the data volume is mounted.
                    region:
                      type: string
                      nullable: true
                      description: ID of the region to run in.
                  required:
                    - cpu
                    - memory
                    - storage
                pgbouncerConfig:
                  type: object
                  nullable: true
                  description: PgBouncer settings. Omit a field to keep its default.
                  properties:
                    defaultPoolSize:
                      type: integer
                      description: Server connections per user and database pair.
                      minimum: 1
                      maximum: 100
                    maxDbConnections:
                      type: integer
                      description: Maximum server connections per database. 0 means no limit.
                      minimum: 0
                      maximum: 500
                    maxDbClientConnections:
                      type: integer
                      description: Maximum client connections per database. 0 means no limit.
                      minimum: 0
                      maximum: 5000
                    maxUserConnections:
                      type: integer
                      description: Maximum server connections per user. 0 means no limit.
                      minimum: 0
                      maximum: 500
                    maxClientConn:
                      type: integer
                      description: Maximum client connections PgBouncer accepts in total.
                      minimum: 1
                      maximum: 10000
                    maxPreparedStatements:
                      type: integer
                      description: Prepared statements tracked per connection, for transaction pooling. 0 turns tracking off.
                      minimum: 0
                      maximum: 10000
                    serverLifetime:
                      type: integer
                      minimum: 60
                      maximum: 86400
                      description: Close server connections older than this, in seconds. 60 to 86400.
                    serverIdleTimeout:
                      type: integer
                      minimum: 10
                      maximum: 86400
                      description: Close server connections idle for longer than this, in seconds. 10 to 86400.
                  additionalProperties: false
                whitelistedIps:
                  type: array
                  description: IP addresses or CIDR ranges allowed to connect. Send an empty list to allow any address.
                  items:
                    type: string
                public:
                  type: boolean
                  nullable: true
                  description: Accept connections from the internet. When `false`, only services on Brimble's private network can connect.
              required:
                - name
                - configurations
      responses:
        '200':
          description: Operation performed successfully, service would be unavailable for few minutes
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    description: Human-readable result of the request.
                    example: Operation performed successfully, service would be unavailable for few minutes
                  data:
                    type: object
                    description: The result of the request.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
