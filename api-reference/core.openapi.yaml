    post:
      tags:
        - Projects
      summary: Create a project
      operationId: createProject
      description: |-
        Creates a project from a git repository (`type: import`, the default), by cloning a template into a new repository (`type: clone`), or from a Docker image. The first deployment starts immediately unless `deploy` is `false`.

        **API key scope:** `project.create`

        **Team role permission:** `project.create`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  description: Project name. Required when importing a repository (`type` omitted or `import`).
                description:
                  type: string
                healthCheckPath:
                  type: string
                buildHealthCheck:
                  type: boolean
                preStartCommand:
                  type: string
                teamId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Team to act in. Omit for your personal workspace.
                environmentId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                git:
                  type: string
                  enum:
                    - GITHUB
                    - GITLAB
                    - BITBUCKET
                    - DOCKER
                    - HUGGINGFACE
                    - ORIGIN
                  description: Git provider, or `DOCKER` to deploy an image. Case-insensitive.
                repo:
                  allOf:
                    - $ref: '#/components/schemas/RepoType'
                  description: Required unless `template` is set.
                autoscalingGroup:
                  type: string
                  nullable: true
                buildCommand:
                  type: string
                outputDirectory:
                  type: string
                rootDirectory:
                  type: string
                dockerfile:
                  type: string
                watchPaths:
                  type: array
                  items:
                    type: string
                installCommand:
                  type: string
                runtimeVersions:
                  type: object
                  properties:
                    node:
                      type: string
                      nullable: true
                    python:
                      type: string
                      nullable: true
                    go:
                      type: string
                      nullable: true
                    php:
                      type: string
                      nullable: true
                    java:
                      type: string
                      nullable: true
                    ruby:
                      type: string
                      nullable: true
                    dotnet:
                      type: string
                      nullable: true
                    deno:
                      type: string
                      nullable: true
                    rust:
                      type: string
                      nullable: true
                    elixir:
                      type: string
                      nullable: true
                    erlang:
                      type: string
                      nullable: true
                    gleam:
                      type: string
                      nullable: true
                isPrivate:
                  type: boolean
                serviceType:
                  enum:
                    - web-service
                    - static
                    - mcp
                    - worker
                  type: string
                cronEnabled:
                  type: boolean
                cronExpression:
                  type: string
                cronTimezone:
                  type: string
                cronCommand:
                  type: string
                authEnabled:
                  type: boolean
                  default: false
                public:
                  type: boolean
                environments:
                  type: array
                  items:
                    $ref: '#/components/schemas/SecretInput'
                installationId:
                  oneOf:
                    - type: string
                    - type: number
                  description: Git provider installation id. Required for GitHub when `git` is `GITHUB`.
                type:
                  enum:
                    - import
                    - clone
                  type: string
                  description: Type should either be clone or import
                clone:
                  type: object
                  description: Required when `type` is `clone`.
                  properties:
                    name:
                      type: string
                    private:
                      type: boolean
                  required:
                    - name
                    - private
                template:
                  type: string
                configurations:
                  allOf:
                    - $ref: '#/components/schemas/ComputeConfigurations'
                registry_credentials:
                  type: object
                  properties:
                    username:
                      type: string
                    token:
                      type: string
                diskSize:
                  type: integer
                  minimum: 10
                  maximum: 150
                volumeId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                mountPath:
                  type: string
                deploy:
                  type: boolean
                  default: true
                startCommand:
                  type: string
                  nullable: true
                framework:
                  type: string
                  nullable: true
              required:
                - git
                - serviceType
      responses:
        '200':
          description: Projects created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Projects created successfully
                  data:
                    $ref: '#/components/schemas/CreateProjectResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
