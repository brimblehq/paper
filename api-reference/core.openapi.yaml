    post:
      tags:
        - Projects
      summary: Redeploy a project
      operationId: redeployProject
      description: |-
        Redeploys the project. With an empty body it rebuilds the latest commit. Send `logId` to redeploy the commit of an earlier deployment (rollback), or `startOnly: true` to restart without rebuilding. Including `name` together with build settings updates the project settings before redeploying.

        **API key scope:** `project.deploy`

        **Team role permission:** `project.deploy`
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                healthCheckPath:
                  type: string
                authEnabled:
                  type: boolean
                  default: false
                public:
                  type: boolean
                deleteVolume:
                  type: boolean
                http2:
                  type: boolean
                buildHealthCheck:
                  type: boolean
                preStartCommand:
                  type: string
                dockerfile:
                  type: string
                runtimeVersions:
                  type: object
                  properties:
                    node:
                      type: string
                      nullable: true
                    python:
                      type: string
                      nullable: true
                    go:
                      type: string
                      nullable: true
                    php:
                      type: string
                      nullable: true
                    java:
                      type: string
                      nullable: true
                    ruby:
                      type: string
                      nullable: true
                    dotnet:
                      type: string
                      nullable: true
                    deno:
                      type: string
                      nullable: true
                    rust:
                      type: string
                      nullable: true
                    elixir:
                      type: string
                      nullable: true
                    erlang:
                      type: string
                      nullable: true
                    gleam:
                      type: string
                      nullable: true
                watchPaths:
                  type: array
                  items:
                    type: string
                configurations:
                  type: object
                  properties:
                    cpu:
                      type: number
                    memory:
                      type: number
                    storage:
                      type: number
                    region:
                      type: string
                      nullable: true
                  required:
                    - cpu
                    - memory
                    - storage
                diskSize:
                  type: integer
                  minimum: 10
                  maximum: 150
                volumeId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                mountPath:
                  type: string
                autoscalingGroup:
                  type: string
                  nullable: true
                serviceType:
                  type: string
                  enum:
                    - web-service
                    - static
                    - mcp
                    - worker
                cronEnabled:
                  type: boolean
                cronExpression:
                  type: string
                cronTimezone:
                  type: string
                cronCommand:
                  type: string
                sendReport:
                  type: boolean
                logId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  description: Redeploy the commit from this earlier deployment.
                buildCacheEnabled:
                  type: boolean
                  nullable: true
                installCommand:
                  type: string
                  nullable: true
                buildCommand:
                  type: string
                  nullable: true
                startCommand:
                  type: string
                  nullable: true
                outputDirectory:
                  type: string
                  nullable: true
                rootDirectory:
                  type: string
                  nullable: true
                framework:
                  type: string
                  nullable: true
                repo:
                  allOf:
                    - $ref: '#/components/schemas/RepoType'
                  nullable: true
                name:
                  type: string
                  description: Project name. When present, the other settings in the body are saved to the project before redeploying.
