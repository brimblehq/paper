        - lifecycle
        - versioning
        - bucketPolicy
        - objectAcl
        - publicWebsite
        - copyObject
        - objectTagging
        - notifications
        - replication
        - select
        - objectLock
        - inventory
        - nativeIam
    StorageLifecycleRule:
      type: object
      properties:
        id:
          type: string
          nullable: true
          description: Name of the rule.
        prefix:
          type: string
          nullable: true
          description: Only objects whose key starts with this prefix are affected. Empty applies to the whole bucket.
        expirationDays:
          type: number
          nullable: true
          description: Delete objects this many days after they were created.
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/StorageLifecycleRuleTransition'
          nullable: true
          description: Move objects to another storage class after a number of days.
    StorageLifecycleRuleTransition:
      type: object
      properties:
        days:
          type: number
          nullable: true
          description: Days after creation when the object moves.
        storageClass:
          type: string
          nullable: true
          description: Storage class to move the object to.
    StorageObjectResponse:
      type: object
      properties:
        key:
          type: string
          description: Full object key, including the folder path.
        path:
          type: string
          description: Object path shown in the dashboard. Folders end with `/`.
        size:
          type: number
          description: Object size, in bytes.
        etag:
          type: string
          nullable: true
          description: Entity tag of the object. Changes when the content changes.
        last_modified:
          type: string
          nullable: true
          description: When the object was last written (ISO 8601).
        url:
          type: string
          nullable: true
          description: URL to download the object. Signed and temporary unless the bucket is public.
        public_url:
          type: string
          nullable: true
          description: Permanent public URL. Only set when the bucket is public.
        expiresIn:
          type: number
          nullable: true
          description: Seconds until `url` expires. `null` when the URL does not expire.
      required:
        - key
        - path
        - size
        - last_modified
        - url
        - public_url
        - expiresIn
    StreamFrame:
      type: object
      description: 'One Server-Sent Event. Each event is sent as `data: <json>` followed by a blank line. Comment lines (`: open`, `: ping`) are keep-alives.'
      oneOf:
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: "Frame type: `stdout` and `stderr` carry output; `done` ends the stream; `error` reports a failure."
              enum:
                - stdout
            data:
              type: string
              description: Chunk of output.
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: "Frame type: `stdout` and `stderr` carry output; `done` ends the stream; `error` reports a failure."
              enum:
                - stderr
            data:
              type: string
              description: Chunk of output.
        - type: object
          required:
            - type
            - exit_code
            - duration_ms
          properties:
            type:
              type: string
              description: "Frame type: `stdout` and `stderr` carry output; `done` ends the stream; `error` reports a failure."
              enum:
                - done
            exit_code:
              type: integer
              description: Exit code of the command. `0` means success.
            duration_ms:
              type: integer
              description: How long the command ran, in milliseconds.
            resolved_cwd:
              type: string
              description: Terminal sessions only.
        - type: object
          required:
            - type
            - message
          properties:
            type:
              type: string
              description: "Frame type: `stdout` and `stderr` carry output; `done` ends the stream; `error` reports a failure."
              enum:
                - error
            message:
              type: string
              description: Error message.
    TimeSeries:
      type: object
      properties:
        name:
          type: string
          description: Series name, for example `success` or `errors`.
        points:
          type: array
          description: Data points, oldest first.
          items:
            $ref: '#/components/schemas/TimeSeriesPoint'
      required:
        - name
        - points
    TimeSeriesPoint:
      type: object
      properties:
        t:
          type: number
          description: Timestamp of the point, as a Unix time in seconds.
        v:
          type: number
          nullable: true
          description: Value at that time.
      required:
        - t
        - v
    ValidationErrorResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          description: One entry per invalid field.
          items:
            type: object
            properties:
              type:
                type: string
                description: Always `field`.
                example: field
              value:
                description: Value that was sent.
              msg:
                type: string
                description: What is wrong with the value.
                example: Invalid value
              path:
                type: string
                description: Name of the invalid field. Nested fields use dots, for example `repo.branch`.
                example: name
              location:
                type: string
                description: Part of the request the field was in.
                enum:
                  - body
                  - query
                  - params
                  - headers
                  - cookies
    WorkerObservabilityExecution:
      type: object
      properties:
        totalRuns:
          type: number
          description: Runs in the selected period.
        pending:
          type: number
          description: Runs waiting to start.
        running:
          type: number
          description: Runs in progress.
        complete:
          type: number
          description: Runs that finished successfully.
        failed:
          type: number
          description: Runs that exited with an error.
        lost:
          type: number
          description: Runs whose instance disappeared before they finished.
        successRate:
          type: number
          nullable: true
          description: Share of finished runs that succeeded, as a percentage from 0 to 100.
        avgDurationMs:
          type: number
          nullable: true
          description: Average run duration, in milliseconds.
        p95DurationMs:
          type: number
          nullable: true
          description: 95th-percentile run duration, in milliseconds.
      required:
        - totalRuns
        - pending
        - running
        - complete
        - failed
        - lost
        - successRate
        - avgDurationMs
        - p95DurationMs
    StorageRegion:
      type: object
      properties:
        id:
          type: string
          description: Region ID. Send it as `region` when creating a bucket.
          example: fra
        name:
          type: string
          description: Human-readable location.
          example: Frankfurt, Germany
        geography:
          type: string
          description: Broader area the region belongs to, for example `EUR` or `Africa`.
        description:
          type: string
          description: What the region offers.
        default:
          type: boolean
          description: '`true` for the region used when you create a bucket without `region`.'
      required:
        - id
        - name
        - geography
        - description
        - default
  parameters:
    TeamId:
      name: teamId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ObjectId'
      description: Team to act in. Omit for your personal workspace. API keys created for a team use that team automatically.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Optional. Retrying with the same key and body returns the first result instead of repeating the operation. Reusing a key with a different body returns 409.
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The API key lacks the required scope, your team role lacks the permission, or the feature is not available on your account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
