        activation_checked_at:
          type: string
          format: date-time
          nullable: true
          description: When activation was last checked (ISO 8601).
        _id:
          $ref: '#/components/schemas/ObjectId'
      required:
        - name
        - slug
        - description
        - size
        - members
        - projects
        - ai_usage_count
        - image
        - isCreator
        - build_minutes
        - build_minutes_last_reset_at
        - build_minutes_cycle_anchor
        - spending_limit
        - spending_limit_action
        - spending_limit_breached_at
        - build_disabled
        - build_disabled_by
        - sandbox_disabled
        - sandbox_disabled_by
        - subscription
        - enforce_2fa
        - enforce_2fa_at
        - enforce_2fa_by
        - activation_pending_since
        - pending_member_invites
        - activation_checked_at
        - _id
