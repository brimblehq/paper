    post:
      tags:
        - Secrets
      summary: Create secrets
      operationId: createSecrets
      description: |-
        Adds or updates secrets on the project. Send `?editor=true` to replace the whole set: secrets not in the request are deleted.

        Values are encrypted at rest. The response echoes the secrets you sent. When you list them later, values come back encrypted; use [`POST /v1/decrypt`](/api-reference/secrets/decrypt-secrets) to read them.

        **API key scope:** `env.write`

        **Team role permission:** `env.write`
      parameters:
        - name: projectId
          in: path
          required: true
          description: ID of the project.
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
        - name: editor
          in: query
          required: false
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: Replace all secrets with the ones in the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                environments:
                  type: array
